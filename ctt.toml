# The Python example: a package with its docs, everything a real project uses, up to PyPI.
tools = ["brigade", "yamllint", "gitleaks", "typos", "editorconfig-checker", "zizmor", "taplo", "rumdl", "ruff", "ty", "osv-scanner", "pytest", "uv", "zensical", "pages", "releasaurus", "renovate"]
ci = "github"
operate_schedule = "0 5 * * 1"
# uv:deploy publishes the package on each release.
uv_publish = true
_post_tasks = [
    ["git", "init", "-q"],
    # The tools' pins and checksums, as brigade:update writes them.
    ["mise", "-C", ".brigade", "lock"],
    ["uv", "init", "--lib", "--vcs", "none", "--name", "demo"],
    ["uv", "add", "--dev", "pytest==9.2.0"],
    # The project's files: a test, the docs source, an .editorconfig (editorconfig-checker), renovate.json.
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; p = pathlib.Path('tests'); p.mkdir(); (p / 'test_smoke.py').write_text('import demo\\n\\n\\ndef test_hello():\\n    assert demo.hello()\\n'); pathlib.Path('docs').mkdir(); pathlib.Path('docs/index.md').write_text('# Demo\\n'); pathlib.Path('zensical.toml').write_text('[project]\\nsite_name = \\\"demo\\\"\\n'); open('.gitignore', 'a').write('\\nsite/\\n.cache/\\n'); pathlib.Path('.editorconfig').write_text('root = true\\n\\n[*]\\ninsert_final_newline = true\\n'); pathlib.Path('renovate.json').write_text('{}\\n'); pathlib.Path('README.md').write_text('# Demo\\n\\nA demo package.\\n')"],
    ["git", "add", "-A"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-qm", "init"],
    ["mise", "run", "lint"],
    ["mise", "run", "build"],
    ["mise", "run", "test"],
    # Renders the local template (HEAD) and compares: the generated files are untouched.
    ["mise", "run", "brigade:lint"],
    # uv:deploy against a local index (pypiserver in Docker, on 127.0.0.1 only), twice:
    # the second run skips the files already there (UV_PUBLISH_CHECK_URL).
    ["docker", "rm", "-f", "brigade-ctt-pypi"],
    ["docker", "run", "-d", "--name", "brigade-ctt-pypi", "-p", "127.0.0.1:8099:8080", "pypiserver/pypiserver:v2.4.3", "run", "-a", ".", "-P", ".", "/data/packages"],
    ["uv", "run", "--no-project", "python", "-c", "import time, urllib.request\nfor _ in range(60):\n    try:\n        urllib.request.urlopen('http://127.0.0.1:8099/simple/'); break\n    except OSError:\n        time.sleep(1)\nelse:\n    raise SystemExit('pypiserver did not start')"],
    ["env", "UV_PUBLISH_URL=http://127.0.0.1:8099/", "UV_PUBLISH_CHECK_URL=http://127.0.0.1:8099/simple/", "UV_PUBLISH_USERNAME=ctt", "UV_PUBLISH_PASSWORD=ctt", "mise", "run", "uv:deploy"],
    ["env", "UV_PUBLISH_URL=http://127.0.0.1:8099/", "UV_PUBLISH_CHECK_URL=http://127.0.0.1:8099/simple/", "UV_PUBLISH_USERNAME=ctt", "UV_PUBLISH_PASSWORD=ctt", "mise", "run", "uv:deploy"],
    ["uv", "run", "--no-project", "python", "-c", "import urllib.request; page = urllib.request.urlopen('http://127.0.0.1:8099/simple/demo/').read().decode(); assert 'demo-0.1.0.tar.gz' in page and 'demo-0.1.0-py3-none-any.whl' in page, page"],
    ["docker", "rm", "-f", "brigade-ctt-pypi"],
    # renovate:operate installs its tools (npm trust policy) and re2 (native build allowed).
    ["mise", "exec", "--", "uv", "run", "--no-project", "python", "-c", "import subprocess; r = subprocess.run(['mise', 'run', 'renovate:operate', '--', '--platform=local', '--dry-run=extract'], capture_output=True, text=True); out = r.stdout + r.stderr; assert r.returncode == 0 and 'RE2 not usable' not in out, out[-3000:]"],
]

[output.".ctt/go-github"]
# The Go example: a command with its tests, its binaries attached to each release.
tools = ["brigade", "yamllint", "gitleaks", "typos", "editorconfig-checker", "zizmor", "golangci-lint", "revive", "osv-scanner", "go", "goreleaser", "releasaurus", "renovate"]
ci = "github"
_post_tasks = [
    ["git", "init", "-q"],
    # The tools' pins and checksums, as brigade:update writes them.
    ["mise", "-C", ".brigade", "lock"],
    # The project's files: a command, its test, .gitignore (go:build's binary, goreleaser's dist/), .editorconfig, renovate.json.
    ["uv", "run", "--no-project", "python", "-c", "import pathlib\npathlib.Path('go.mod').write_text('module demo\\n\\ngo 1.27\\n')\npathlib.Path('main.go').write_text('// Package main prints a greeting.\\npackage main\\n\\nimport \"fmt\"\\n\\nfunc main() {\\n\\tfmt.Println(hello())\\n}\\n\\nfunc hello() string {\\n\\treturn \"demo\"\\n}\\n')\npathlib.Path('main_test.go').write_text('package main\\n\\nimport \"testing\"\\n\\nfunc TestHello(t *testing.T) {\\n\\tif got := hello(); got != \"demo\" {\\n\\t\\tt.Fatalf(\"hello() = %q\", got)\\n\\t}\\n}\\n')\npathlib.Path('.gitignore').write_text('dist/\\ndemo\\n')\npathlib.Path('.editorconfig').write_text('root = true\\n\\n[*]\\ninsert_final_newline = true\\n')\npathlib.Path('renovate.json').write_text('{}\\n')\npathlib.Path('README.md').write_text('# Demo\\n\\nA demo command.\\n')\n"],
    ["git", "add", "-A"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-qm", "init"],
    ["mise", "run", "lint"],
    ["mise", "run", "build"],
    ["mise", "run", "test"],
    # Renders the local template (HEAD) and compares: the generated files are untouched.
    ["mise", "run", "brigade:lint"],
    # goreleaser:deploy without publishing: a snapshot builds every archive and the checksums.
    ["mise", "exec", "--", "goreleaser", "release", "--snapshot", "--clean", "-f", ".brigade/configs/goreleaser.yaml"],
    ["uv", "run", "--no-project", "python", "-c", "import pathlib\nnames = [p.name for p in pathlib.Path('dist').iterdir()]\nassert any('linux_amd64' in n for n in names) and any('windows_amd64' in n for n in names) and any(n.endswith('checksums.txt') for n in names), names"],
]

[output.".ctt/rust-github"]
# Tools from a preset: brigade's defaults, then rust (rustfmt, Clippy, cargo build and test).
presets = [["rust"]]
ci = "github"
cargo_publish = true
_post_tasks = [
    ["git", "init", "-q"],
    # The tools' pins and checksums, as brigade:update writes them.
    ["mise", "-C", ".brigade", "lock"],
    # The project's files: a command with its test, .gitignore (cargo's target/), .editorconfig.
    ["uv", "run", "--no-project", "python", "-c", '''
import pathlib
pathlib.Path("src").mkdir()
pathlib.Path("Cargo.toml").write_text("[package]\nname = \"demo\"\nversion = \"0.1.0\"\nedition = \"2024\"\n")
pathlib.Path("src/main.rs").write_text("fn main() {\n    println!(\"{}\", hello());\n}\n\nfn hello() -> &'static str {\n    \"demo\"\n}\n\n#[cfg(test)]\nmod tests {\n    #[test]\n    fn hello() {\n        assert_eq!(super::hello(), \"demo\");\n    }\n}\n")
pathlib.Path(".gitignore").write_text("/target\n")
pathlib.Path(".editorconfig").write_text("root = true\n\n[*]\ninsert_final_newline = true\n")
pathlib.Path("README.md").write_text("# Demo\n\nA demo command.\n")
'''],
    ["mise", "exec", "--", "cargo", "generate-lockfile"],
    ["git", "add", "-A"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-qm", "init"],
    ["mise", "run", "lint"],
    ["mise", "run", "build"],
    ["mise", "run", "test"],
    # Renders the local template (HEAD) and compares: the generated files are untouched.
    ["mise", "run", "brigade:lint"],
    # rust:deploy without publishing: cargo packages and checks the crate.
    ["mise", "exec", "--", "cargo", "publish", "--dry-run"],
]

