[output.".ctt/none-github"]
# No test tool: the test stage does nothing. Adds optional lint tools.
tools = ["yamllint", "gitleaks", "typos", "editorconfig-checker", "zizmor", "hadolint", "shellcheck", "shfmt", "rumdl", "osv-scanner", "golangci-lint", "revive", "tflint", "checkov", "cfn-lint", "dotenv-linter", "stylua", "vale", "lychee", "codespell", "cspell", "ls-lint", "markdownlint", "sqlfluff", "opentofu", "clang-format", "act"]
ci = "github"
_post_tasks = [
    ["git", "init", "-q"],
    # editorconfig-checker needs the project's own .editorconfig; root = true stops it from
    # reading brigade's (end_of_line = lf), which fails on Windows CRLF checkouts.
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; pathlib.Path('.editorconfig').write_text('root = true\\n\\n[*]\\ninsert_final_newline = true\\n')"],
    # A file for each linter: Dockerfile (hadolint, checkov), shell script (shellcheck, shfmt), README (rumdl),
    # Terraform (tflint, checkov), CloudFormation (cfn-lint), .env (dotenv-linter), Lua (stylua), SQL (sqlfluff), C (clang-format); the README for vale, lychee, codespell, cspell, markdownlint.
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; pathlib.Path('docker').mkdir(); pathlib.Path('docker/Dockerfile').write_text('FROM python:3.13-slim\\nUSER 65534\\nHEALTHCHECK NONE\\n'); pathlib.Path('infra').mkdir(); pathlib.Path('infra/main.tf').write_text('terraform {\\n  required_version = \">= 1.0\"\\n}\\n'); pathlib.Path('.env').write_text('FOO=bar\\n'); pathlib.Path('demo.lua').write_text('print(\"demo\")\\n'); pathlib.Path('docker/run.sh').write_text('#!/bin/sh\\necho \"$1\"\\n'); pathlib.Path('README.md').write_text('# Demo\\n\\nSee the [infrastructure](infra/main.tf).\\n'); pathlib.Path('db').mkdir(); pathlib.Path('db/demo.sql').write_text('SELECT 1 AS one\\n'); pathlib.Path('src').mkdir(); pathlib.Path('src/demo.c').write_text('int main(void) { return 0; }\\n'); pathlib.Path('infra/stack.yaml').write_text('---\\nAWSTemplateFormatVersion: \"2010-09-09\"\\nResources:\\n  Wait:\\n    Type: AWS::CloudFormation::WaitConditionHandle\\n')"],
    # A Go module (golangci-lint, revive), with Go pinned in the project's mise.toml.
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; pathlib.Path('mise.toml').write_text('[tools]\\ngo = \"1.27.4\"\\n'); pathlib.Path('go.mod').write_text('module demo\\n\\ngo 1.27\\n'); pathlib.Path('main.go').write_text('// Package main prints demo.\\npackage main\\n\\nimport \"fmt\"\\n\\nfunc main() {\\n\\tfmt.Println(\"demo\")\\n}\\n')"],
    ["mise", "trust", "-q", "mise.toml"],
    ["git", "add", "-A"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-q", "--allow-empty", "-m", "init"],
    ["mise", "run", "brigade:hooks"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-q", "--allow-empty", "-m", "check hook"],
    ["mise", "run", "lint"],
    ["mise", "run", "test"],
]

[output.".ctt/template-github"]
# A Copier template project.
tools = ["yamllint", "gitleaks", "typos", "ctt", "act"]
ci = "github"
_post_tasks = [
    ["git", "init", "-q"],
    # A one-file Copier template and its ctt variant.
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; pathlib.Path('copier.yml').write_text('---\\n_subdirectory: tpl\\nname:\\n  type: str\\n  default: demo\\n'); pathlib.Path('tpl').mkdir(); pathlib.Path('tpl/hello.txt.jinja').write_text('hello ' + '{' * 2 + ' name ' + '}' * 2 + '\\n'); pathlib.Path('ctt.toml').write_text('[output.\".out\"]\\nname = \"ctt\"\\n')"],
    ["git", "add", "-A"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-qm", "init"],
    ["mise", "run", "brigade:hooks"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-q", "--allow-empty", "-m", "check hook"],
    ["mise", "run", "lint"],
    ["mise", "run", "test"],
]

[output.".ctt/ansible-github"]
# An Ansible project: ansible-galaxy's role skeleton fails ansible-lint --strict
# (placeholder metadata), and molecule init has no Docker scenario: a one-play
# playbook and a Docker scenario, written here. ansible:deploy and ansible:operate run
# playbooks/ on inventory/ (localhost); deploy.yml needs the vault password.
tools = ["yamllint", "gitleaks", "typos", "ansible-lint", "molecule", "ansible", "act"]
ci = "github"
_post_tasks = [
    ["git", "init", "-q"],
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; pathlib.Path('site.yml').write_text('---\\n- name: Demo\\n  hosts: localhost\\n  gather_facts: false\\n  tasks:\\n    - name: Say hello\\n      ansible.builtin.debug:\\n        msg: hello\\n')"],
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; d = pathlib.Path('molecule/default'); d.mkdir(parents=True); (d / 'molecule.yml').write_text('---\\ndriver:\\n  name: docker\\nplatforms:\\n  - name: instance\\n    image: docker.io/library/python:3.13-slim\\n    pre_build_image: true\\n'); (d / 'converge.yml').write_text('---\\n- name: Converge\\n  hosts: all\\n  gather_facts: false\\n  tasks:\\n    - name: Say hello\\n      ansible.builtin.debug:\\n        msg: hello\\n')"],
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; pathlib.Path('inventory').mkdir(); pathlib.Path('inventory/hosts.yml').write_text('---\\nall:\\n  hosts:\\n    localhost:\\n      ansible_connection: local\\n'); pathlib.Path('playbooks').mkdir(); pathlib.Path('playbooks/operate.yml').write_text('---\\n- name: Operate\\n  hosts: all\\n  gather_facts: false\\n  tasks:\\n    - name: Say hello\\n      ansible.builtin.debug:\\n        msg: hello\\n')"],
    # A vault-encrypted variable, with the password from ANSIBLE_VAULT_PASSWORD (brigade's script).
    ["mise", "exec", "--", "uv", "run", "--no-project", "python", "-c", "import os, pathlib, subprocess; env = {**os.environ, 'ANSIBLE_VAULT_PASSWORD': 'ctt'}; v = subprocess.run(['ansible-vault', 'encrypt_string', '--vault-password-file', '.brigade/scripts/ansible-vault-password.py', 'from vault', '--name', 'message'], env=env, capture_output=True, text=True, check=True).stdout; pathlib.Path('playbooks/deploy.yml').write_text('---\\n- name: Deploy\\n  hosts: all\\n  gather_facts: false\\n  vars:\\n' + ''.join('    ' + line + '\\n' for line in v.splitlines()) + '  tasks:\\n    - name: Show the secret\\n      ansible.builtin.assert:\\n        that: message == \"from vault\"\\n')"],
    ["git", "add", "-A"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-qm", "init"],
    ["mise", "run", "brigade:hooks"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-q", "--allow-empty", "-m", "check hook"],
    ["mise", "run", "lint"],
    ["mise", "run", "test"],
    # deploy decrypts the vault variable with ANSIBLE_VAULT_PASSWORD; operate needs no secret.
    ["mise", "exec", "--", "uv", "run", "--no-project", "python", "-c", "import os, subprocess; subprocess.run(['mise', 'run', 'deploy'], env={**os.environ, 'ANSIBLE_VAULT_PASSWORD': 'ctt'}, check=True)"],
    ["mise", "run", "operate"],
]
