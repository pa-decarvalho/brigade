    ["uv", "run", "--no-project", "python", "-c", "import pathlib\npathlib.Path('src').mkdir()\npathlib.Path('test').mkdir()\npathlib.Path('package.json').write_text('{\\n\\t\"name\": \"@brigade-ctt/demo\",\\n\\t\"version\": \"0.1.0\",\\n\\t\"type\": \"module\",\\n\\t\"main\": \"dist/index.js\",\\n\\t\"types\": \"dist/index.d.ts\",\\n\\t\"files\": [\\n\\t\\t\"dist\"\\n\\t],\\n\\t\"scripts\": {\\n\\t\\t\"build\": \"tsc\",\\n\\t\\t\"test\": \"node --test\",\\n\\t\\t\"prepublishOnly\": \"npm run build\"\\n\\t},\\n\\t\"publishConfig\": {\\n\\t\\t\"access\": \"public\"\\n\\t},\\n\\t\"devDependencies\": {\\n\\t\\t\"typescript\": \"7.0.2\"\\n\\t}\\n}\\n')\npathlib.Path('tsconfig.json').write_text('{\\n\\t\"compilerOptions\": {\\n\\t\\t\"target\": \"ES2022\",\\n\\t\\t\"module\": \"NodeNext\",\\n\\t\\t\"declaration\": true,\\n\\t\\t\"rootDir\": \"src\",\\n\\t\\t\"outDir\": \"dist\",\\n\\t\\t\"strict\": true\\n\\t},\\n\\t\"include\": [\"src\"]\\n}\\n')\npathlib.Path('src/index.ts').write_text('export function hello(name: string): string {\\n\\treturn `Hello, ${name}!`;\\n}\\n')\npathlib.Path('test/index.test.ts').write_text('import assert from \"node:assert/strict\";\\nimport { test } from \"node:test\";\\nimport { hello } from \"../src/index.ts\";\\n\\ntest(\"hello\", () => {\\n\\tassert.equal(hello(\"demo\"), \"Hello, demo!\");\\n});\\n')\npathlib.Path('.gitignore').write_text('node_modules/\\ndist/\\n')\npathlib.Path('.npmrc').write_text('//127.0.0.1:4873/:_authToken=${NPM_TOKEN}\\n')\npathlib.Path('.editorconfig').write_text('root = true\\n\\n[*]\\ninsert_final_newline = true\\n')\npathlib.Path('renovate.json').write_text('{}\\n')\npathlib.Path('README.md').write_text('# Demo\\n\\nA demo TypeScript library.\\n')\n"],
