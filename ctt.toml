# Each variant creates a real git project with the ecosystem's tool, applies brigade,
# then runs its stages.

[defaults]

[output.".ctt/python-github"]
tools = ["yamllint", "gitleaks", "typos", "ruff", "renovate", "pytest", "act", "uv", "zensical", "pages", "releasaurus"]
ci = "github"
operate_schedule = "0 5 * * 1"
# The lint stage runs these commands, in order.
lint_commands = ["mise run ruff:lint", "mise run typos:lint"]
_post_tasks = [
    ["git", "init", "-q"],
    ["uv", "init", "--lib", "--vcs", "none", "--name", "demo"],
    ["uv", "add", "--dev", "pytest==9.2.0"],
    ["uv", "run", "python", "-c", "import pathlib; p = pathlib.Path('tests'); p.mkdir(); (p / 'test_smoke.py').write_text('import demo\\n\\n\\ndef test_import():\\n    assert demo\\n')"],
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; pathlib.Path('renovate.json').write_text('{}\\n')"],
    # The documentation source: brigade only adds the build and deploy tools.
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; pathlib.Path('docs').mkdir(); pathlib.Path('docs/index.md').write_text('# Demo\\n'); pathlib.Path('zensical.toml').write_text('[project]\\nsite_name = \"demo\"\\n'); open('.gitignore', 'a').write('\\nsite/\\n.cache/\\n')"],
    ["git", "add", "-A"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-qm", "init"],
    ["mise", "run", "brigade:hooks"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-q", "--allow-empty", "-m", "check hook"],
    ["mise", "run", "lint"],
    ["mise", "run", "build"],
    ["mise", "run", "test"],
    # renovate:operate installs its tools (npm trust policy).
    ["mise", "run", "renovate:operate", "--", "--version"],
]

[output.".ctt/python-gitlab"]
tools = ["yamllint", "gitleaks", "typos", "ruff", "pytest", "gitlab-ci-local", "zensical", "pages"]
ci = "gitlab"
# No build stage: the other CI jobs must not depend on it.
build_enabled = false
# Custom version and command for a tool.
customize_tools = true
typos_version = "1.51.1"
ruff_lint_command = "ruff check --extend-exclude .mise-data ."
_post_tasks = [
    ["git", "init", "-q"],
    ["uv", "init", "--lib", "--vcs", "none", "--name", "demo"],
    ["uv", "add", "--dev", "pytest==9.2.0"],
    ["uv", "run", "python", "-c", "import pathlib; p = pathlib.Path('tests'); p.mkdir(); (p / 'test_smoke.py').write_text('import demo\\n\\n\\ndef test_import():\\n    assert demo\\n')"],
    # The documentation source: brigade only adds the build and deploy tools.
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; pathlib.Path('docs').mkdir(); pathlib.Path('docs/index.md').write_text('# Demo\\n'); pathlib.Path('zensical.toml').write_text('[project]\\nsite_name = \"demo\"\\n'); open('.gitignore', 'a').write('\\nsite/\\n.cache/\\n')"],
    ["git", "add", "-A"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-qm", "init"],
    # The custom version and command are in the rendered files.
    ["mise", "exec", "--", "uv", "run", "--no-project", "python", "-c", "import pathlib; d = pathlib.Path('.mise/conf.d'); assert '1.51.1' in (d / 'tool-typos.toml').read_text(); assert 'ruff check --extend-exclude .mise-data .' in (d / 'tool-ruff.toml').read_text()"],
    ["mise", "run", "brigade:hooks"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-q", "--allow-empty", "-m", "check hook"],
    ["mise", "run", "lint"],
    ["mise", "run", "test"],
    # No build stage: pages:deploy still builds site/ through zensical:build.
    ["mise", "run", "deploy"],
    ["mise", "exec", "--", "uv", "run", "--no-project", "python", "-c", "import pathlib; assert pathlib.Path('site/index.html').is_file()"],
]

