[output.".ctt/none-github"]
# No test tool: the test stage does nothing. Adds an optional lint tool.
tools = ["yamllint", "gitleaks", "typos", "editorconfig-checker", "act"]
ci = "github"
_post_tasks = [
    ["git", "init", "-q"],
    # editorconfig-checker needs the project's own .editorconfig; root = true stops it from
    # reading brigade's (end_of_line = lf), which fails on Windows CRLF checkouts.
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; pathlib.Path('.editorconfig').write_text('root = true\\n\\n[*]\\ninsert_final_newline = true\\n')"],
    ["git", "add", "-A"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-q", "--allow-empty", "-m", "init"],
    ["mise", "run", "brigade:hooks"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-q", "--allow-empty", "-m", "check hook"],
    ["mise", "run", "lint"],
    ["mise", "run", "test"],
]

[output.".ctt/template-github"]
# A Copier template project.
tools = ["yamllint", "gitleaks", "typos", "ctt", "act"]
ci = "github"
_post_tasks = [
    ["git", "init", "-q"],
    # A one-file Copier template and its ctt variant.
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; pathlib.Path('copier.yml').write_text('---\\n_subdirectory: tpl\\nname:\\n  type: str\\n  default: demo\\n'); pathlib.Path('tpl').mkdir(); pathlib.Path('tpl/hello.txt.jinja').write_text('hello ' + '{' * 2 + ' name ' + '}' * 2 + '\\n'); pathlib.Path('ctt.toml').write_text('[output.\".out\"]\\nname = \"ctt\"\\n')"],
    ["git", "add", "-A"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-qm", "init"],
    ["mise", "run", "brigade:hooks"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-q", "--allow-empty", "-m", "check hook"],
    ["mise", "run", "lint"],
    ["mise", "run", "test"],
]
