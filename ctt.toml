# Each variant creates a real git project with the ecosystem's tool, applies brigade,
# then runs its stages. Tools per stage default from languages.

[defaults]

[output.".ctt/python-github"]
languages = ["python"]
ci = "github"
build = ["uv"]
release = ["pypi"]
_post_tasks = [
    ["git", "init", "-q"],
    ["uv", "init", "--lib", "--vcs", "none", "--name", "demo"],
    # A user-owned CI layout: lint split into two jobs, test with the full git history.
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; p = pathlib.Path('.github/ci.toml'); p.parent.mkdir(exist_ok=True); p.write_text('[[lint]]\\ntask = \"lint:ruff\"\\n\\n[[lint]]\\ntask = \"lint:typos\"\\n\\n[[test]]\\ntask = \"test\"\\nfetch-depth = 0\\n\\n[[build]]\\ntask = \"build\"\\n\\n[[release]]\\ntask = \"release\"\\n')"],
    ["uv", "add", "--dev", "pytest==9.2.0"],
    ["uv", "run", "python", "-c", "import pathlib; p = pathlib.Path('tests'); p.mkdir(); (p / 'test_smoke.py').write_text('import demo\\n\\n\\ndef test_import():\\n    assert demo\\n')"],
    ["git", "add", "-A"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-qm", "init"],
    ["mise", "run", "brigade:hooks"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-q", "--allow-empty", "-m", "check hook"],
    ["mise", "run", "lint"],
    ["mise", "run", "build"],
    ["mise", "run", "test"],
]

