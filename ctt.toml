[output.".ctt/python-gitea"]
languages = ["python"]
ci = "gitea"
build = ["uv"]
_post_tasks = [
    ["git", "init", "-q"],
    # actionlint resolves ./.gitea/workflows/custom.yml from the nearest .github/workflows,
    # which is brigade's own inside .ctt/: give this project one, like a standalone repo.
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; pathlib.Path('.github/workflows').mkdir(parents=True)"],
    ["uv", "init", "--lib", "--vcs", "none", "--name", "demo"],
    ["uv", "add", "--dev", "pytest==9.2.0"],
    ["uv", "run", "python", "-c", "import pathlib; p = pathlib.Path('tests'); p.mkdir(); (p / 'test_smoke.py').write_text('import demo\\n\\n\\ndef test_import():\\n    assert demo\\n')"],
    ["git", "add", "-A"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-qm", "init"],
    ["mise", "run", "brigade:hooks"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-q", "--allow-empty", "-m", "check hook"],
    ["mise", "run", "lint"],
    ["mise", "run", "build"],
    ["mise", "run", "test"],
]

