[output.".ctt/rust-mirror"]
lint = ["yamllint", "gitleaks", "typos", "clippy", "rustfmt"]
test = ["cargo"]
ci = "none"
# Mirrors set to the upstream servers: checks the generated settings, not a real mirror.
github_mirror = "https://github.com/"
pypi_index = "https://pypi.org/simple"
rustup_mirror = "https://static.rust-lang.org"
_post_tasks = [
    ["git", "init", "-q"],
    ["cargo", "init", "--lib", "--name", "demo"],
    ["git", "add", "-A"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-qm", "init"],
    ["mise", "run", "brigade:hooks"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-q", "--allow-empty", "-m", "check hook"],
    ["mise", "run", "lint"],
    ["mise", "run", "test"],
]

[output.".ctt/none-github"]
# No test tool: the test stage is left out. Adds an optional lint tool.
lint = ["yamllint", "gitleaks", "typos", "editorconfig-checker"]
ci = "github"
ci_local = true
_post_tasks = [
    ["git", "init", "-q"],
    # editorconfig-checker needs the project's own .editorconfig; root = true stops it from
    # reading brigade's (end_of_line = lf), which fails on Windows CRLF checkouts.
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; pathlib.Path('.editorconfig').write_text('root = true\\n\\n[*]\\ninsert_final_newline = true\\n')"],
    ["git", "add", "-A"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-q", "--allow-empty", "-m", "init"],
    ["mise", "run", "brigade:hooks"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-q", "--allow-empty", "-m", "check hook"],
    ["mise", "run", "lint"],
]

[output.".ctt/template-github"]
# A Copier template project.
lint = ["yamllint", "gitleaks", "typos"]
test = ["ctt"]
ci = "github"
ci_local = true
customize_tools = true
# ponytail: --list avoids ctt 3.0.0's git snapshot, which fails on Windows. Back to the default when fixed.
test_ctt_command = "ctt --list"
_post_tasks = [
    ["git", "init", "-q"],
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; pathlib.Path('ctt.toml').write_text('[output.\".out\"]\\n')"],
    ["git", "add", "-A"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-qm", "init"],
    ["mise", "run", "brigade:hooks"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-q", "--allow-empty", "-m", "check hook"],
    ["mise", "run", "lint"],
    ["mise", "run", "test"],
]
