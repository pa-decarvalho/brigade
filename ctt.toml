# Each variant creates a real git project with the ecosystem's tool, applies brigade,
# then runs its stages.

[defaults]

[output.".ctt/python-github"]
lint = ["yamllint", "gitleaks", "typos", "ruff", "taplo", "renovate"]
test = ["pytest"]
ci = "github"
ci_local = true
build = ["uv", "zensical"]
deploy = ["pages"]
release = ["pypi"]
_post_tasks = [
    ["git", "init", "-q"],
    ["uv", "init", "--lib", "--vcs", "none", "--name", "demo"],
    # A user-owned CI layout: lint split into two jobs, test with the full git history.
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; p = pathlib.Path('.github/ci.toml'); p.parent.mkdir(exist_ok=True); p.write_text('[[lint]]\\ntask = \"lint:ruff\"\\n\\n[[lint]]\\ntask = \"lint:typos\"\\n\\n[[test]]\\ntask = \"test\"\\nfetch-depth = 0\\n\\n[[build]]\\ntask = \"build\"\\n\\n[[release]]\\ntask = \"release\"\\n\\n[[deploy]]\\ntask = \"deploy\"\\n')"],
    ["uv", "add", "--dev", "pytest==9.2.0"],
    ["uv", "run", "python", "-c", "import pathlib; p = pathlib.Path('tests'); p.mkdir(); (p / 'test_smoke.py').write_text('import demo\\n\\n\\ndef test_import():\\n    assert demo\\n')"],
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; pathlib.Path('renovate.json').write_text('{}\\n')"],
    # The documentation source: brigade only adds the build and deploy tools.
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; pathlib.Path('docs').mkdir(); pathlib.Path('docs/index.md').write_text('# Demo\\n'); pathlib.Path('zensical.toml').write_text('[project]\\nsite_name = \"demo\"\\n'); open('.gitignore', 'a').write('\\nsite/\\n.cache/\\n')"],
    ["git", "add", "-A"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-qm", "init"],
    ["mise", "run", "brigade:hooks"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-q", "--allow-empty", "-m", "check hook"],
    ["mise", "run", "lint"],
    ["mise", "run", "build"],
    ["mise", "run", "test"],
]

[output.".ctt/python-gitlab"]
lint = ["yamllint", "gitleaks", "typos", "ruff"]
test = ["pytest"]
ci = "gitlab"
ci_local = true
# Custom version and command for a tool.
customize_tools = true
lint_typos_version = "1.51.1"
lint_ruff_command = "ruff check ."
_post_tasks = [
    ["git", "init", "-q"],
    ["uv", "init", "--lib", "--vcs", "none", "--name", "demo"],
    ["uv", "add", "--dev", "pytest==9.2.0"],
    ["uv", "run", "python", "-c", "import pathlib; p = pathlib.Path('tests'); p.mkdir(); (p / 'test_smoke.py').write_text('import demo\\n\\n\\ndef test_import():\\n    assert demo\\n')"],
    ["git", "add", "-A"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-qm", "init"],
    # After the render: starts with mise so that test:update, which runs other tasks first, skips it.
    ["mise", "exec", "--", "uv", "run", "--no-project", "python", "-c", "import pathlib; d = pathlib.Path('.mise/conf.d'); assert '1.51.1' in (d / 'lint-typos.toml').read_text(); assert 'ruff check .' in (d / 'lint-ruff.toml').read_text()"],
    ["mise", "run", "brigade:hooks"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-q", "--allow-empty", "-m", "check hook"],
    ["mise", "run", "lint"],
    ["mise", "run", "test"],
]

[output.".ctt/python-gitea"]
lint = ["yamllint", "gitleaks", "typos", "ruff"]
test = ["pytest"]
ci = "gitea"
ci_local = true
build = ["uv"]
_post_tasks = [
    ["git", "init", "-q"],
    # actionlint resolves ./.gitea/workflows/custom.yml from the nearest .github/workflows,
    # which is brigade's own inside .ctt/: give this project one, like a standalone repo.
    ["uv", "run", "--no-project", "python", "-c", "import pathlib; pathlib.Path('.github/workflows').mkdir(parents=True)"],
    ["uv", "init", "--lib", "--vcs", "none", "--name", "demo"],
    ["uv", "add", "--dev", "pytest==9.2.0"],
    ["uv", "run", "python", "-c", "import pathlib; p = pathlib.Path('tests'); p.mkdir(); (p / 'test_smoke.py').write_text('import demo\\n\\n\\ndef test_import():\\n    assert demo\\n')"],
    ["git", "add", "-A"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-qm", "init"],
    ["mise", "run", "brigade:hooks"],
    ["git", "-c", "user.name=brigade", "-c", "user.email=brigade@localhost", "commit", "-q", "--allow-empty", "-m", "check hook"],
    ["mise", "run", "lint"],
    ["mise", "run", "build"],
    ["mise", "run", "test"],
]

