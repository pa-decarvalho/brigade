# The React example: a Vite app with ESLint and Vitest, published to GitHub Pages on each release.
# No osv-scanner: a new advisory on one of the many npm dependencies would fail an unchanged test.
tools = ["brigade", "yamllint", "gitleaks", "typos", "editorconfig-checker", "zizmor", "node", "pages", "releasaurus", "renovate"]
ci = "github"
# Vite writes the site to dist/.
pages_dir = "dist"
# A direct release on each releasable push, with no release PR.
customize_tools = true
releasaurus_workflow = "direct"
_post_tasks = [
    ["git", "init", "-q"],
    # The tools' pins and checksums, as brigade:update writes them.
    ["mise", "-C", ".brigade", "lock"],
    # The project's files: a Vite React app in TypeScript, a Vitest test, ESLint (project dependencies), .gitignore, .editorconfig, renovate.json.
    ["uv", "run", "--no-project", "python", "-c", "import pathlib\npathlib.Path('src').mkdir()\npathlib.Path('package.json').write_text('{\\n  \"name\": \"demo\",\\n  \"private\": true,\\n  \"version\": \"0.1.0\",\\n  \"type\": \"module\",\\n  \"scripts\": {\\n    \"dev\": \"vite\",\\n    \"lint\": \"eslint .\",\\n    \"build\": \"tsc && vite build\",\\n    \"test\": \"vitest run\"\\n  },\\n  \"dependencies\": {\\n    \"react\": \"19.3.1\",\\n    \"react-dom\": \"19.3.1\"\\n  },\\n  \"devDependencies\": {\\n    \"@eslint/js\": \"10.0.1\",\\n    \"@types/react\": \"19.3.0\",\\n    \"@types/react-dom\": \"19.3.0\",\\n    \"@vitejs/plugin-react\": \"6.3.0\",\\n    \"eslint\": \"10.15.0\",\\n    \"typescript\": \"6.0.3\",\\n    \"typescript-eslint\": \"8.72.2\",\\n    \"vite\": \"8.3.8\",\\n    \"vitest\": \"5.1.0\"\\n  }\\n}\\n')\npathlib.Path('tsconfig.json').write_text('{\\n  \"compilerOptions\": {\\n    \"target\": \"ES2022\",\\n    \"lib\": [\\n      \"ES2022\",\\n      \"DOM\",\\n      \"DOM.Iterable\"\\n    ],\\n    \"module\": \"ESNext\",\\n    \"moduleResolution\": \"bundler\",\\n    \"jsx\": \"react-jsx\",\\n    \"strict\": true,\\n    \"noEmit\": true,\\n    \"skipLibCheck\": true,\\n    \"types\": [\\n      \"vite/client\"\\n    ]\\n  },\\n  \"include\": [\\n    \"src\",\\n    \"vite.config.ts\"\\n  ]\\n}\\n')\npathlib.Path('index.html').write_text('<!doctype html>\\n<html lang=\"en\">\\n  <head>\\n    <meta charset=\"UTF-8\" />\\n    <title>Demo</title>\\n  </head>\\n  <body>\\n    <div id=\"root\"></div>\\n    <script type=\"module\" src=\"/src/main.tsx\"></script>\\n  </body>\\n</html>\\n')\npathlib.Path('vite.config.ts').write_text('import react from \"@vitejs/plugin-react\";\\nimport { defineConfig } from \"vitest/config\";\\n\\nexport default defineConfig({ plugins: [react()] });\\n')\npathlib.Path('eslint.config.js').write_text('import js from \"@eslint/js\";\\nimport tseslint from \"typescript-eslint\";\\n\\nexport default tseslint.config({ ignores: [\"dist\"] }, js.configs.recommended, ...tseslint.configs.recommended);\\n')\npathlib.Path('src/greeting.ts').write_text('export function greeting(name: string): string {\\n  return `Hello, ${name}!`;\\n}\\n')\npathlib.Path('src/greeting.test.ts').write_text('import { expect, test } from \"vitest\";\\nimport { greeting } from \"./greeting\";\\n\\ntest(\"greeting\", () => {\\n  expect(greeting(\"demo\")).toBe(\"Hello, demo!\");\\n});\\n')\npathlib.Path('src/App.tsx').write_text('import { greeting } from \"./greeting\";\\n\\nexport function App() {\\n  return <h1>{greeting(\"demo\")}</h1>;\\n}\\n')\npathlib.Path('src/main.tsx').write_text('import { StrictMode } from \"react\";\\nimport { createRoot } from \"react-dom/client\";\\nimport { App } from \"./App\";\\n\\nconst root = document.getElementById(\"root\");\\nif (root) {\\n  createRoot(root).render(\\n    <StrictMode>\\n      <App />\\n    </StrictMode>,\\n  );\\n}\\n')\npathlib.Path('.gitignore').write_text('node_modules/\\ndist/\\n')\npathlib.Path('.editorconfig').write_text('root = true\\n\\n[*]\\ninsert_final_newline = true\\n')\npathlib.Path('renovate.json').write_text('{}\\n')\npathlib.Path('README.md').write_text('# Demo\\n\\nA demo React app.\\n')\n"],
