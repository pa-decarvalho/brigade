# Pipeline stages, in order. Each stage runs its jobs' commands or its commands if it has
# some (in order), otherwise every "<tool>:<stage>" task; tools have one file each in conf.d/.
# A job is also a "<stage>-<name>" task, which CI runs as a job of its own.
# Tasks run at the project root: dir is relative to this file's folder.

[tasks.lint]
description = "Stage: static checks"
dir = "{{config_root}}/.."
depends = [{ task = "*:lint", optional = true }]

[tasks.build]
description = "Stage: build"
dir = "{{config_root}}/.."
depends = [{ task = "*:build", optional = true }]

[tasks.test]
description = "Stage: tests"
dir = "{{config_root}}/.."
run = ["mise run ctt:test -- -t .ctt/python-github", "mise run ctt:test -- -t .ctt/go-github", "mise run ctt:test -- -t .ctt/python-docker-github", "mise run ctt:test -- -t .ctt/node-github", "mise run ctt:test -- -t .ctt/react-github", "mise run ctt:test -- -t .ctt/angular-github", "mise run ctt:test -- -t .ctt/rust-github", "mise run ctt:test -- -t .ctt/python-gitlab", "mise run ctt:test -- -t .ctt/template-gitlab", "mise run ctt:test -- -t .ctt/template-gitea", "mise run ctt:test -- -t .ctt/python-gitea", "mise run ctt:test -- -t .ctt/python-mirror", "mise run ctt:test -- -t .ctt/none-github", "mise run ctt:test -- -t .ctt/template-github", "mise run ctt:test -- -t .ctt/ansible-github"]

[tasks."test-python-github"]
description = "Job python-github of the test stage (CI)"
hide = true
dir = "{{config_root}}/.."
run = ["mise run ctt:test -- -t .ctt/python-github"]

