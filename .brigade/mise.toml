min_version = "2026.11.0"

[tools]
uv = "0.13.9"

# Stages are in stages.toml, tools in conf.d/ (one file each), all listed in .miserc.toml.
# mise.lock (and .mise/locks/) locks them all: written by brigade:update, or mise -C .brigade lock.
# Tasks run at the project root: dir is relative to this file's folder.

[tasks."brigade:update"]
description = "Update brigade files from the template"
dir = "{{config_root}}/.."
# Applies data.yml, even uncommitted (see the script); extra arguments go to Copier.
run = "uv run --no-project python .brigade/scripts/brigade_update.py uvx copier@9.19.1 update -a .brigade/copier/answers.yml"
