        run:
        - mise run ctt:test -- -t .ctt/python-docker-github
    -   name: node-github
        run:
        - mise run ctt:test -- -t .ctt/node-github
    -   name: react-github
        run:
        - mise run ctt:test -- -t .ctt/react-github
    -   name: angular-github
        run:
        - mise run ctt:test -- -t .ctt/angular-github
    -   name: rust-github
        run:
        - mise run ctt:test -- -t .ctt/rust-github
