# ruff config (ruff check / ruff format --check --config .brigade/configs/ruff.toml).
# brigade-owned: updated by mise run brigade:update.
# For your own settings, set ruff_config to your file.
# It replaces [tool.ruff] in pyproject.toml.
# .mise-data is the GitLab CI tool cache (node ships a Python file).
extend-exclude = [".mise-data"]
