[tools]
"aqua:jdx/jactionlint" = "2.6.0"
# jactionlint checks run: scripts with the shellcheck in PATH: pinned, so local runs match CI's.
shellcheck = "0.11.0"

[tasks."jactionlint:lint"]
description = "Check GitHub workflows and actions with jactionlint"
dir = "{{config_root}}/../.."
# Only this project's files (not the copies in subfolders); Python globs on every OS.
run = '''uv run --no-project python -c "import glob, subprocess, sys; sys.exit(subprocess.call(['jactionlint', *glob.glob('.github/workflows/*.yml'), *glob.glob('.brigade/ci/github/actions/*/action.yml')]))"'''
