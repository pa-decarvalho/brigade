[tools]
# renovate: datasource=github-releases depName=tamasfe/taplo
taplo = "0.10.0"

[tasks."taplo:lint"]
description = "Check TOML formatting with taplo"
dir = "{{config_root}}/../.."
# brigade's TOML files only. Config: .brigade/configs/taplo.toml (the project's).
run = '''taplo fmt --check -c .brigade/configs/taplo.toml ".brigade/**/*.toml" .miserc.toml mise.toml ctt.toml zensical.toml releasaurus.toml "template/**/*.toml"'''
