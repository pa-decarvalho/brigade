[tools]
# A project tool, not only on the task: re2's install script must run with this node, not the
# system's (its native binary is built for one Node.js version).
# renovate: datasource=node-version depName=node
node = "26.13.1"
# renovate: datasource=pypi depName=check-jsonschema
"pipx:check-jsonschema" = { version = "0.39.0", uvx_args = "--with json5" }

[tasks."renovate:lint"]
description = "Check the Renovate config"
dir = "{{config_root}}/../.."
run = '''check-jsonschema --builtin-schema vendor.renovate .github/renovate.json5'''

# Runs Renovate (needs RENOVATE_TOKEN and RENOVATE_REPOSITORIES: CI sets them). Renovate itself is on the task, so other CI jobs skip it.
[tasks."renovate:operate"]
description = "Run Renovate"
dir = "{{config_root}}/../.."
run = '''renovate'''

# Renovate also follows brigade: on a new release, its PR runs brigade:update (Renovate's own
# change to _commit is undone first, since Copier diffs from the current version), in its own PR
# (Copier needs a clean tree). Renovate's
# handlebars templates are escaped twice: for Copier, then for mise (Tera).
[tasks."renovate:operate".env]
RENOVATE_CONFIG = '''{% raw %}{
    "allowedCommands": [
        "^git checkout -- \\.brigade/copier/answers\\.yml$",
        "^mise run brigade:update -- --defaults --vcs-ref [0-9A-Za-z.+-]+$"
    ],
    "customManagers": [{
        "customType": "regex",
        "managerFilePatterns": ["/^\\.brigade/copier/answers\\.yml$/"],
        "matchStrings": ["_commit: (?<currentValue>\\S+)\\n_src_path: (?<depName>\\S+)"],
        "datasourceTemplate": "git-tags",
        "packageNameTemplate": "{{{replace '^gh:' 'https://github.com/' (replace '^gl:' 'https://gitlab.com/' depName)}}}",
        "depNameTemplate": "brigade"
    }],
    "packageRules": [{
        "matchDepNames": ["brigade"],
        "groupName": null,
        "commitMessageTopic": "brigade",
        "postUpgradeTasks": {
            "commands": [
                "git checkout -- .brigade/copier/answers.yml",
                "mise run brigade:update -- --defaults --vcs-ref {{{newVersion}}}"
            ],
            "executionMode": "branch"
        }
    }]
}{% endraw %}'''

[tasks."renovate:operate".tools]
# @yarnpkg/libzip 3.2.2 has no npm provenance (manual publish of yarnpkg/berry's 2eb9830 release),
# which mise's trust policy rejects: exempt that one version only. re2 (RE2 regexes, as Renovate
# validates them) installs its native binary with a script, which runs only when allowed.
# renovate: datasource=npm depName=renovate
"npm:renovate" = { version = "44.239.1", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"], allow_builds = ["re2"] }
