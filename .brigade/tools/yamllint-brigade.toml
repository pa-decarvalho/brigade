[tools]
# renovate: datasource=pypi depName=yamllint
"pipx:yamllint" = "1.38.0"

[tasks."yamllint:lint"]
description = "Check YAML files with yamllint"
dir = "{{config_root}}/../.."
# Config: .brigade/configs/yamllint.yml (the project's).
run = '''yamllint --strict -c .brigade/configs/yamllint.yml .'''
