---
# brigade-owned: updated by mise run brigade:update, do not edit.
name: deploy
description: mise run deploy, with the project's tools
inputs:
  ansible-private-key:
    description: SSH private key for Ansible (ANSIBLE_PRIVATE_KEY secret)
    default: ""
  ansible-vault-password:
    description: Ansible vault password (ANSIBLE_VAULT_PASSWORD secret)
    default: ""
runs:
  using: composite
  steps:
    # Not the mise action: no cache restored where a release is published.
    - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      with:
        version: 2026.11.7
        cache: false
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ANSIBLE_PRIVATE_KEY: ${{ inputs.ansible-private-key }}
        ANSIBLE_VAULT_PASSWORD: ${{ inputs.ansible-vault-password }}
        GIT_COMMITTER_NAME: ${{ github.actor }}
        GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
      run: mise run deploy
