---
# brigade-owned: updated by mise run brigade:update, do not edit.
name: build
description: mise run build, with the project's tools
inputs:
  task:
    description: The task to run (a split stage), else the stage
    default: build
  unit:
    description: BRIGADE_UNIT, the unit of the task (a split stage)
    default: ""
runs:
  using: composite
  steps:
    - uses: ./.brigade/ci/github/actions/mise # zizmor: ignore[self-repository]
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        TASK: ${{ inputs.task }}
        BRIGADE_UNIT: ${{ inputs.unit }}
      run: mise run "$TASK"
