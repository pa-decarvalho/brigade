---
# brigade-owned: updated by mise run brigade:update, do not edit.
name: mise
description: Install brigade's pinned mise and the project's tools
inputs:
  cache:
    description: Restore and save the mise tool cache
    default: "true"
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: 2026.11.6
        cache: ${{ inputs.cache }}
