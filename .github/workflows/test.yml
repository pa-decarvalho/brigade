---
# brigade-owned: updated by mise run brigade:update, do not edit.
# Runs on pull requests: mise run test (.mise/conf.d/stages.toml).
name: Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  # One group per pull request (its ref): a new push cancels the older run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/mise
      - run: mise run test
