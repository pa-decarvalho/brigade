---
# brigade-owned: updated by mise run brigade:update, do not edit.
# Runs on pull requests: mise run test (.brigade/stages.toml).
name: Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  # One group per pull request (its ref): a new push cancels the older run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One CI job per job of the stage (the jobs answer: the <stage>-<name>
  # tasks), in parallel.
  run:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python-github
            task: test-python-github
          - name: go-github
            task: test-go-github
          - name: python-docker-github
            task: test-python-docker-github
          - name: java-maven-github
            task: test-java-maven-github
          - name: java-gradle-github
            task: test-java-gradle-github
          - name: helm-github
            task: test-helm-github
          - name: bun-github
            task: test-bun-github
          - name: deno-github
            task: test-deno-github
          - name: hugo-github
            task: test-hugo-github
          - name: node-github
            task: test-node-github
          - name: react-github
            task: test-react-github
          - name: angular-github
            task: test-angular-github
          - name: rust-github
            task: test-rust-github
          - name: python-gitlab
            task: test-python-gitlab
          - name: template-gitlab
            task: test-template-gitlab
          - name: template-forgejo
            task: test-template-forgejo
          - name: python-gitea
            task: test-python-gitea
          - name: python-mirror
            task: test-python-mirror
          - name: none-github
            task: test-none-github
          - name: template-github
            task: test-template-github
          - name: ansible-github
            task: test-ansible-github
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mise run test # zizmor: ignore[self-repository]
        uses: ./.brigade/ci/github/actions/test
        with:
          task: ${{ matrix.task }}
  # The stage's check (branch protection): all its jobs passed.
  test:
    # Skipped with its jobs (release, on a branch other than the default one).
    if: always() && needs.run.result != 'skipped'
    needs: [run]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          RUN: ${{ needs.run.result }}
        run: test "$RUN" = success
