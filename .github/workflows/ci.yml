---
name: CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.6
        with:
          version: 2026.11.2
      - run: mise run lint

  docs:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.6
        with:
          version: 2026.11.2
      - run: mise run docs:test

  ctt:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.6
        with:
          version: 2026.11.2
      - run: mise run ctt:test

  update:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # tags, for update:test
      - uses: jdx/mise-action@v5.2.6
        with:
          version: 2026.11.2
      - run: mise run update:test

  # Generated CI runs in Linux containers (Docker): Linux runner only.
  ci:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.6
        with:
          version: 2026.11.2
      - run: mise run ci:test
