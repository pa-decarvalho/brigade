---
# brigade-owned: updated by mise run brigade:update, do not edit.
# Each stage runs mise run <stage>, defined in .mise/conf.d/stages.toml.
# Other jobs: add your own workflow file.
name: CI

on:
  pull_request:
  push:
    # release runs on main (the default branch), deploy on X.Y.Z tags.
    branches: [main]
    tags: ["*.*.*"]
  # Deploy without a release, e.g. a typo in the documentation.
  workflow_dispatch:

jobs:

  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/mise
      - run: mise run lint

  build:
    needs: ["lint"]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/mise
      - run: mise run build

  test:
    needs: ["lint", "build"]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/mise
      - run: mise run test

  release:
    needs: ["lint", "build", "test"]
    if: >-
      ${{ !cancelled() && !failure()
      && github.event_name == 'push' && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write  # release PR labels
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RELEASAURUS_FORGE: github
      RELEASAURUS_REPO: ${{ github.server_url }}/${{ github.repository }}
      # Optional bot token: the release PR and tag made with the workflow token
      # start no CI (merge the PR with a bypass, run deploy by hand).
      RELEASAURUS_GITHUB_TOKEN: >-
        ${{ secrets.RELEASAURUS_GITHUB_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/mise
      - run: mise run release

  deploy:
    needs: ["lint", "build", "test", "release"]
    if: >-
      ${{ !cancelled() && !failure()
      && (startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # pages:deploy pushes the gh-pages branch
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GIT_COMMITTER_NAME: ${{ github.actor }}
      GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/mise
      - run: mise run deploy
