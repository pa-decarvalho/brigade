---
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write  # release PR labels
  pull-requests: write

jobs:
  # Same as the template's release job, until brigade is generated by brigade.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASAURUS_FORGE: github
      RELEASAURUS_REPO: ${{ github.server_url }}/${{ github.repository }}
      # The workflow token: its release PR and tags start no CI, so the release
      # PR is merged with a bypass. Copier only needs the tags.
      RELEASAURUS_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.6
        with:
          version: 2026.11.2
      - run: mise run release
