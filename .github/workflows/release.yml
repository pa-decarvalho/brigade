---
# brigade-owned: updated by mise run brigade:update, do not edit.
# Runs on pushes to the default branch: mise run release.
name: Release

# Any branch, since the default branch cannot be named here: the job checks it.
on:
  push:
    branches: ["**"]

# A new run waits for the running one: no half-done release. Per branch, so
# a push to another branch does not replace a pending release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# No token rights by default: each job sets its own.
permissions: {}

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write # release PR labels
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # releasaurus's git operations
      - name: mise run release # zizmor: ignore[self-repository]
        uses: ./.brigade/ci/github/actions/release
        with:
          # Optional bot token, else the workflow token.
          token: ${{ secrets.RELEASAURUS_GITHUB_TOKEN }}
