---
name: "🧑‍🍳 New recipe"
description: An idea or a change for brigade (questions, stages, CI...).
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        ## 🧑‍🍳 A new recipe for the brigade

        brigade adds mise tooling and CI to a project: it does not
        scaffold the project itself. Keep it simple: tell us the need
        first, the recipe second.
  - type: textarea
    id: need
    attributes:
      label: 🥄 The need
      description: What you are trying to do, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 💡 Your idea
      description: How brigade could help. Alternatives welcome.
  - type: checkboxes
    id: checks
    attributes:
      label: ✅ Before sending
      options:
        - label: I searched the existing issues.
          required: true
