---
# brigade-owned: updated by mise run brigade:update, do not edit.
# Jobs of each stage: .github/ci.toml. Extra jobs: .github/workflows/custom.yml.
name: CI

on:
  pull_request:
  # Releases: the release stage only runs on these tags.
  push:
    tags: ["*.*.*"]
  # Deploy without a release, e.g. a typo in the documentation.
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.plan.outputs.lint }}
      build: ${{ steps.plan.outputs.build }}
      test: ${{ steps.plan.outputs.test }}
      release: ${{ steps.plan.outputs.release }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/mise
        with:
          tools: uv
      - id: plan
        run: mise run brigade:ci-plan .github/ci.toml
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"

  lint:
    needs: plan
    if: needs.plan.outputs.lint != '[]'
    name: ${{ matrix.task }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.lint) }}
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch-depth }}
      - uses: ./.github/actions/mise
      - run: mise run ${{ matrix.task }}

  build:
    needs: [plan, lint]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.build != '[]' }}
    name: ${{ matrix.task }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch-depth }}
      - uses: ./.github/actions/mise
      - run: mise run ${{ matrix.task }}

  test:
    needs: [plan, lint, build]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.test != '[]' }}
    name: ${{ matrix.task }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.test) }}
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch-depth }}
      - uses: ./.github/actions/mise
      - run: mise run ${{ matrix.task }}

  release:
    needs: [plan, lint, build, test]
    if: >-
      ${{ !cancelled() && !failure()
      && needs.plan.outputs.release != '[]'
      && startsWith(github.ref, 'refs/tags/') }}
    name: ${{ matrix.task }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.release) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing
    env:
      GITHUB_TOKEN: ${{ github.token }}
      # Publishing tokens, from the repository secrets.
      UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch-depth }}
      - uses: ./.github/actions/mise
      - run: mise run ${{ matrix.task }}

  deploy:
    needs: [plan, lint, build, test, release]
    if: >-
      ${{ !cancelled() && !failure()
      && needs.plan.outputs.deploy != '[]'
      && (startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch') }}
    name: ${{ matrix.task }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.deploy) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # deploy:pages pushes the gh-pages branch
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GIT_COMMITTER_NAME: ${{ github.actor }}
      GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch-depth }}
      - uses: ./.github/actions/mise
      - run: mise run ${{ matrix.task }}

  custom:
    needs: [lint, build, test, release, deploy]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/custom.yml
    secrets: inherit
