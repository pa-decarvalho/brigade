# Lint tools shared by every project type. Tool config is given inline: no config files.

[tools]
"pipx:yamllint" = "1.38.0"
gitleaks = "8.30.1"
typos = "1.52.0"

[tasks."lint:yamllint"]
description = "Check YAML files with yamllint"
run = 'yamllint --strict -d "{extends: default, ignore: [.venv/, node_modules/, .mise-data/], rules: {truthy: {check-keys: false}, new-lines: disable}}" .'

[tasks."lint:gitleaks"]
description = "Check git history and staged changes for secrets with gitleaks"
run = [
    "gitleaks git --redact --no-banner",
    "gitleaks git --pre-commit --staged --redact --no-banner",
]

[tasks."lint:typos"]
description = "Check spelling with typos"
run = "typos --hidden --exclude .git"
