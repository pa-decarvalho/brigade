---
name: CI

on:
  pull_request:

# Forgejo resolves actions on data.forgejo.org, which mirrors actions/checkout
# but not jdx/mise-action: install mise with its script.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install mise
        run: |
          curl -fsSL https://mise.run | MISE_VERSION=v2026.11.2 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mise trust && mise install
      - run: mise run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install mise
        run: |
          curl -fsSL https://mise.run | MISE_VERSION=v2026.11.2 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mise trust && mise install
      - run: mise run test
