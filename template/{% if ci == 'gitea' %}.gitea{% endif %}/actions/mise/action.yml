---
# brigade-owned: updated by mise run brigade:update, do not edit.
# Forgejo resolves actions on data.forgejo.org, which mirrors actions/checkout
# but not jdx/mise-action: install mise with its script.
name: mise
description: Install brigade's pinned mise and the project's tools
inputs:
  tools:
    description: Tools to install (default all)
    default: ""
runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      run: |
        curl -fsSL https://mise.run | MISE_VERSION=v2026.11.2 sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Install tools
      shell: bash
      run: |
        mise trust
        mise install ${{ inputs.tools }}
