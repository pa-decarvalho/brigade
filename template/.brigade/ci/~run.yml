  # One job per task (or unit) of the stage, in parallel.
  run:
    name: {% raw %}${{ matrix.name }}{% endraw %}
    needs: matrix
    if: needs.matrix.outputs.jobs != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: {% raw %}${{ fromJSON(needs.matrix.outputs.jobs) }}{% endraw %}
