---
# brigade-owned: updated by mise run brigade:update, do not edit.
name: deploy
description: mise run deploy, with the project's tools
inputs:
  task:
    description: The task to run (a job of a split stage), else the stage
    default: deploy
  environment:
    description: The environment to deploy to (BRIGADE_ENVIRONMENT), if any
    default: ""
  environments:
    description: The project's environments, a JSON list, to check environment
    default: "[]"
  kubeconfig-data:
    description: Cluster's kubeconfig, helm:deploy (KUBECONFIG_DATA secret)
    default: ""
  helm-namespace:
    description: Namespace, helm:deploy (HELM_NAMESPACE variable)
    default: ""
  ansible-private-key:
    description: SSH private key for Ansible (ANSIBLE_PRIVATE_KEY secret)
    default: ""
  ansible-vault-password:
    description: Ansible vault password (ANSIBLE_VAULT_PASSWORD secret)
    default: ""
runs:
  using: composite
  steps:
    # A run started by hand may name an environment the project does not have.
    - shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        ENVIRONMENTS: ${{ inputs.environments }}
      run: >-
        python3 -c "import json, os, sys; e = os.environ['ENVIRONMENT'];
        names = json.loads(os.environ['ENVIRONMENTS']);
        sys.exit(e and e not in names and f'unknown environment {e}: {names}')"
    - uses: ./.brigade/ci/gitea/actions/mise # zizmor: ignore[self-repository]
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        FORGEJO_TOKEN: "" # not sent to the tools' forges (see ../mise)
        BRIGADE_ENVIRONMENT: ${{ inputs.environment }}
        KUBECONFIG_DATA: ${{ inputs.kubeconfig-data }}
        HELM_NAMESPACE: ${{ inputs.helm-namespace }}
        ANSIBLE_PRIVATE_KEY: ${{ inputs.ansible-private-key }}
        ANSIBLE_VAULT_PASSWORD: ${{ inputs.ansible-vault-password }}
        GIT_COMMITTER_NAME: ${{ github.actor }}
        GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
        TASK: ${{ inputs.task }}
      run: mise run "$TASK"
