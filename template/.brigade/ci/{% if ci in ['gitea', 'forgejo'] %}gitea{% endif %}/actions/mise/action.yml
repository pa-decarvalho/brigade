---
# brigade-owned: updated by mise run brigade:update, do not edit.
# Forgejo resolves actions on data.forgejo.org, which mirrors actions/checkout
# but not jdx/mise-action, and act refuses full URLs: install mise with its
# script. It checks the archive against SHASUMS256.txt from the same server, so
# it trusts HTTPS only: unverified-download is ignored here.
name: mise
description: Install brigade's pinned mise and the project's tools
runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      run: | # jactionlint ignore=unverified-download
        curl -fsSL https://mise.run | MISE_VERSION=v2026.11.10 sh
    # With mise's shims: mise does not put a task's tools on PATH when aube
    # builds one (npm:renovate with allow_builds, in a ~aube~ folder).
    - name: Put mise on PATH
      shell: bash
      run: | # zizmor: ignore[github-env]
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
    - name: Install tools
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        # Forgejo Actions sets it (this Forgejo's token): mise's forgejo:
        # backend would send it to the tools' own forge (gitea.com for tea),
        # which refuses it (401). Gitea sets none.
        FORGEJO_TOKEN: ""
      run: |
        mise trust
        mise install
