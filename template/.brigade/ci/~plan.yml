  # ci_jobs tool: the stage's jobs, one per task (.brigade/scripts/ci_jobs.py).
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      jobs: {% raw %}${{ steps.plan.outputs.jobs }}{% endraw %}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
{%- if ci == 'github' %}
      # mise only: no tools, no cache (deploy publishes).
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8
          install: false
          cache: false
{%- else %}
      - uses: ./.brigade/ci/{{ ci }}/actions/mise
{%- endif %}
      - id: plan
        shell: bash
        run: >-
          echo "jobs=$(mise exec uv -- uv run --no-project python
          .brigade/scripts/ci_jobs.py {{ stage }})" >> "$GITHUB_OUTPUT"
