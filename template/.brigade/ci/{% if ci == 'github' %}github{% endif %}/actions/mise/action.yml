---
# brigade-owned: updated by mise run brigade:update, do not edit.
name: mise
description: Install brigade's pinned mise and the project's tools
runs:
  using: composite
  steps:
    # Python tools link to uv's Python: it must be in the cache with them
    # (mise's data dir), else a version that needs a newer Python than the
    # runner's is missing after a cache restore. zizmor: a fixed value.
    - shell: bash
      run: >-  # zizmor: ignore[github-env]
        echo "UV_PYTHON_INSTALL_DIR=$HOME/.local/share/mise/uv-python"
        >> "$GITHUB_ENV"
    - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      with:
        version: 2026.11.7
        # mise-action hashes only the default config paths: hash brigade's.
        cache_key_prefix: >-
          mise-${{ hashFiles('.miserc.toml', '.brigade/**/*.toml') }}
