---
# brigade-owned: updated by mise run brigade:update, do not edit.
name: lint
description: mise run lint, with the project's tools
inputs:
  task:
    description: The task to run (a job of a split stage), else the stage
    default: lint
runs:
  using: composite
  steps:
    - uses: ./.brigade/ci/github/actions/mise # zizmor: ignore[self-repository]
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        TASK: ${{ inputs.task }}
      run: mise run "$TASK"
