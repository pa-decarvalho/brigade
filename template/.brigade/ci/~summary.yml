  # The stage's check (branch protection): its jobs passed, or there were none.
  {{ stage }}:
    if: always()
    needs: [matrix, run]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          MATRIX: {% raw %}${{ needs.matrix.result }}{% endraw %}
          RUN: {% raw %}${{ needs.run.result }}{% endraw %}
        run: >-
          test "$MATRIX" = success
          && { test "$RUN" = success || test "$RUN" = skipped; }
