---
# brigade-owned: updated by mise run brigade:update, do not edit.
name: build
description: mise run build, with the project's tools
inputs:
  task:
    description: The task to run (a job of a split stage), else the stage
    default: build
runs:
  using: composite
  steps:
    - uses: ./.brigade/ci/gitea/actions/mise
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        TASK: ${{ inputs.task }}
      run: mise run "$TASK"
