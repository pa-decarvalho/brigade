---
# brigade-owned: updated by mise run brigade:update, do not edit.
name: lint
description: mise run lint, with the project's tools
inputs:
  task:
    description: The task to run (a split stage), else the stage
    default: lint
  unit:
    description: BRIGADE_UNIT, the unit of the task (a split stage)
    default: ""
runs:
  using: composite
  steps:
    - uses: ./.brigade/ci/gitea/actions/mise
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        TASK: ${{ inputs.task }}
        BRIGADE_UNIT: ${{ inputs.unit }}
      run: mise run "$TASK"
