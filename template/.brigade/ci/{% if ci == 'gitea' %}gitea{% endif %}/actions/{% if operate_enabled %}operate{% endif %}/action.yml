---
# brigade-owned: updated by mise run brigade:update, do not edit.
name: operate
description: mise run operate (e.g. Renovate), with the project's tools
inputs:
  renovate-token:
    description: Renovate's token (RENOVATE_TOKEN secret)
    default: ""
runs:
  using: composite
  steps:
    - uses: ./.brigade/ci/gitea/actions/mise
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RENOVATE_PLATFORM: gitea
        RENOVATE_ENDPOINT: ${{ github.server_url }}/api/v1
        RENOVATE_REPOSITORIES: ${{ github.repository }}
        RENOVATE_TOKEN: ${{ inputs.renovate-token }}
        RENOVATE_ONBOARDING: "false"
      run: mise run operate
