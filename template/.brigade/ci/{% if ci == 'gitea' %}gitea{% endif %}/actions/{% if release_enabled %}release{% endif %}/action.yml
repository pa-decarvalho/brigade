---
# brigade-owned: updated by mise run brigade:update, do not edit.
name: release
description: mise run release (Releasaurus), with the project's tools
inputs:
  token:
    description: >-
      Optional bot token: the release PR and tag made with the workflow token
      start no CI (merge the PR with a bypass, run deploy by hand)
    default: ""
runs:
  using: composite
  steps:
    - uses: ./.brigade/ci/gitea/actions/mise
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RELEASAURUS_FORGE: gitea
        RELEASAURUS_REPO: ${{ github.server_url }}/${{ github.repository }}
        RELEASAURUS_GITEA_TOKEN: ${{ inputs.token || github.token }}
      run: mise run release
