min_version = "2026.11.0"

[tools]
uv = "0.13.8"

# Stages are in stages.toml, tools in tools/ (one file each), all listed in .miserc.toml.
# Tasks run at the project root: dir is relative to this file's folder.

[tasks."brigade:update"]
description = "Update brigade files from the template"
dir = "{{config_root}}/.."
run = "uvx copier@9.19.1 update -a .brigade/copier/answers.yml --data-file .brigade/copier/data.yml"
depends_post = ["brigade:data"]

# Writes all the answers back to data.yml, new questions included, as copier/data.yml.jinja does.
[tasks."brigade:data"]
description = "Write the answers to .brigade/copier/data.yml"
hide = true
dir = "{{config_root}}/.."
run = '''uv run --no-project python -c "import pathlib, re; f = pathlib.Path('.brigade/copier'); (f / 'data.yml').write_text('# Your answers: edit them, commit, then run mise run brigade:update.' + chr(10) + re.sub(r'(?m)^(---|#|_commit:|_src_path:).*\n', '', (f / 'answers.yml').read_text(encoding='utf-8')), encoding='utf-8')"'''
