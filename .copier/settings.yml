---
_min_copier_version: "9.19.1"
_subdirectory: template
_answers_file: .brigade/copier/answers.yml
# Created once, then written by brigade:update (Copier would merge it).
_skip_if_exists:
  - .brigade/copier/data.yml
  # Tool configs: the project's (docs/tools.md).
  - .brigade/configs/*
# Jinja snippets included by the CI files, not files of the project.
_exclude:
  - .brigade/ci/~*
