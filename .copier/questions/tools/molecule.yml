---
molecule_matrix:
  type: yaml
  help: >-
    molecule scenarios with a CI job each (BRIGADE_UNIT, molecule -s;
    empty: one job for all)
  default: []
  when: "{{ ci_jobs == 'tool' and 'molecule' in tools }}"

molecule_version:
  type: str
  help: molecule version (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'molecule' in tools }}"

molecule_test_command:
  type: str
  help: Command of molecule:test (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'molecule' in tools }}"

molecule_converge_command:
  type: str
  help: Command of molecule:converge (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'molecule' in tools }}"

molecule_verify_command:
  type: str
  help: Command of molecule:verify (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'molecule' in tools }}"

molecule_destroy_command:
  type: str
  help: Command of molecule:destroy (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'molecule' in tools }}"

molecule_reconverge_command:
  type: str
  help: Command of molecule:reconverge (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'molecule' in tools }}"

molecule_login_command:
  type: str
  help: Command of molecule:login (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'molecule' in tools }}"
