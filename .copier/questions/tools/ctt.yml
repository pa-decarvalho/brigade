---
ctt_matrix:
  type: yaml
  help: >-
    ctt variants with a CI job each, which splits the test stage into one
    job per task (BRIGADE_UNIT, ctt -t; empty: one test job)
  default: []
  when: "{{ ci != 'none' and 'ctt' in tools }}"

ctt_version:
  type: str
  help: copier-template-tester version (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'ctt' in tools }}"

ctt_test_command:
  type: str
  help: Command of ctt:test (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'ctt' in tools }}"
