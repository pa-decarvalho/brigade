---
renovate_version:
  type: str
  help: check-jsonschema version (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'renovate' in tools }}"

renovate_lint_command:
  type: str
  help: Command of renovate:lint (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'renovate' in tools }}"

renovate_operate_command:
  type: str
  help: Command of renovate:operate (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'renovate' in tools }}"

renovate_cli_version:
  type: str
  help: Renovate version for renovate:operate (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'renovate' in tools }}"

renovate_node_version:
  type: str
  help: Node.js version for renovate:operate (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'renovate' in tools }}"

renovate_config:
  type: str
  help: Config file of Renovate, from the project root (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'renovate' in tools }}"

renovate_updates:
  type: str
  help: What Renovate updates
  multiselect: true
  choices:
    brigade (its updates, with Copier and tool pins): brigade
    dependencies (your project's own): dependencies
    template (a Copier template's template/ folder, as brigade's): template
  default: [brigade]
  when: "{{ 'renovate' in tools }}"

renovate_automerge:
  type: bool
  help: Merge Renovate's PRs once their checks pass
  default: false
  when: "{{ 'renovate' in tools }}"
