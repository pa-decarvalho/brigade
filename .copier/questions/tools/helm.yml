---
helm_publish:
  type: bool
  help: >-
    Push the charts to an OCI registry on each release (helm:deploy)?
  default: false
  when: "{{ 'helm' in tools }}"

helm_version:
  type: str
  help: Helm version (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'helm' in tools }}"

helm_lint_command:
  type: str
  help: Command of helm:lint (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'helm' in tools }}"

helm_deploy_command:
  type: str
  help: Command of helm:deploy (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'helm' in tools and helm_publish }}"
