---
cargo_publish:
  type: bool
  help: Publish the crate to its registry on each release (rust:deploy)?
  default: false
  when: "{{ 'rust' in tools }}"

rust_version:
  type: str
  help: Rust version (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'rust' in tools }}"

rust_lint_command:
  type: str
  help: Command of rust:lint (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'rust' in tools }}"

rust_build_command:
  type: str
  help: Command of rust:build (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'rust' in tools }}"

rust_test_command:
  type: str
  help: Command of rust:test (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'rust' in tools }}"

rust_deploy_command:
  type: str
  help: Command of rust:deploy (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'rust' in tools and cargo_publish }}"
