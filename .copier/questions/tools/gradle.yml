---
gradle_publish:
  type: bool
  help: >-
    Publish the artifacts to a Maven repository on each release (gradle:deploy)?
  default: false
  when: "{{ 'gradle' in tools }}"

gradle_version:
  type: str
  help: Gradle version (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'gradle' in tools }}"

gradle_java_version:
  type: str
  help: Java version, Eclipse Temurin (e.g. 21; empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'gradle' in tools }}"

gradle_config:
  type: str
  help: >-
    Init script of gradle:deploy, from the project root (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'gradle' in tools and gradle_publish }}"

gradle_build_command:
  type: str
  help: Command of gradle:build (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'gradle' in tools }}"

gradle_test_command:
  type: str
  help: Command of gradle:test (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'gradle' in tools }}"

gradle_deploy_command:
  type: str
  help: Command of gradle:deploy (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'gradle' in tools and gradle_publish }}"
