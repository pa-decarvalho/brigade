---
ty_version:
  type: str
  help: ty version (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'ty' in tools }}"

ty_config:
  type: str
  help: Config file of ty, from the project root (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'ty' in tools }}"

ty_lint_command:
  type: str
  help: Command of ty:lint (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'ty' in tools }}"
