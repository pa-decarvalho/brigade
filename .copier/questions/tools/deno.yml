---
deno_publish:
  type: bool
  help: Publish the package to JSR on each release (deno:publish)?
  default: false
  when: "{{ 'deno' in tools }}"

deno_version:
  type: str
  help: Deno version (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'deno' in tools }}"

deno_lint_command:
  type: str
  help: Command of deno:lint (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'deno' in tools }}"

deno_test_command:
  type: str
  help: Command of deno:test (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'deno' in tools }}"

deno_publish_command:
  type: str
  help: Command of deno:publish (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'deno' in tools and deno_publish }}"
