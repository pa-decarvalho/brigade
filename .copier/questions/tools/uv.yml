---
uv_publish:
  type: bool
  help: Publish the package to its index on each release (uv:publish)?
  default: false
  when: "{{ 'uv' in tools }}"

uv_build_command:
  type: str
  help: Command of uv:build (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'uv' in tools }}"

uv_publish_command:
  type: str
  help: Command of uv:publish (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'uv' in tools and uv_publish }}"
