---
pages_dir:
  type: str
  help: "Folder your build writes the site to (zensical: site, Vite: dist)"
  default: site
  when: "{{ 'pages' in tools }}"

pages_version:
  type: str
  help: ghp-import version (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'pages' in tools and ci == 'github' }}"

pages_deploy_command:
  type: str
  help: Command of pages:deploy (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'pages' in tools }}"
