---
rumdl_version:
  type: str
  help: rumdl version (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'rumdl' in tools }}"

rumdl_config:
  type: str
  help: Config file of rumdl, from the project root (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'rumdl' in tools }}"

rumdl_lint_command:
  type: str
  help: Command of rumdl:lint (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'rumdl' in tools }}"
