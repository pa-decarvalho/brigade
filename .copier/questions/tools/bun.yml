---
bun_publish:
  type: bool
  help: Publish the package to its npm registry on each release (bun:publish)?
  default: false
  when: "{{ 'bun' in tools }}"

bun_version:
  type: str
  help: Bun version (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'bun' in tools }}"

bun_lint_command:
  type: str
  help: Command of bun:lint (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'bun' in tools }}"

bun_build_command:
  type: str
  help: Command of bun:build (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'bun' in tools }}"

bun_test_command:
  type: str
  help: Command of bun:test (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'bun' in tools }}"

bun_publish_command:
  type: str
  help: Command of bun:publish (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'bun' in tools and bun_publish }}"
