---
# Computed values, never asked nor saved (when: false): included last, so
# that they can use every answer.

# The stages run as one CI job per job of the jobs answer.
split_stages:
  type: yaml
  default: >-
    {{ jobs | dictsort | selectattr(1) | map(attribute=0) | list
    if jobs is mapping else [] }}
  when: false
