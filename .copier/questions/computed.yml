---
# Computed values, never asked nor saved (when: false): included last, so
# that they can use every answer.

# The stages run as one CI job per job of the jobs answer.
split_stages:
  type: yaml
  default: >-
    {{ jobs | dictsort | selectattr(1) | map(attribute=0) | list
    if jobs is mapping else [] }}
  when: false

# The environments deploy starts by itself once a release is published: the
# environments answer's auto ones, or, without environments, "" (one
# unnamed deploy) when deploy_auto.
auto_environments:
  type: yaml
  default: >-
    {{ (environments | selectattr('auto', 'defined') | selectattr('auto')
    | map(attribute='name') | list) if environments
    else ([''] if deploy_auto else []) }}
  when: false
