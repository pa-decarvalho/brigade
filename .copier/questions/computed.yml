---
# Computed values, never asked nor saved (when: false): included last, so
# that they can use every answer.

# The stages split into one CI job per task: those with a tool's matrix
# (molecule_matrix and ctt_matrix are both in test).
split_stages:
  type: yaml
  default: "{{ ['test'] if (molecule_matrix or ctt_matrix) else [] }}"
  when: false
