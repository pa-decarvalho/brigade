---
# Computed values, never asked nor saved (when: false): included last, so
# that they can use every answer.

# The stages run as one CI job per command (<stage>_jobs).
split_stages:
  type: yaml
  default: >-
    {{ (['lint'] if lint_jobs else []) + (['build'] if build_jobs else [])
    + (['test'] if test_jobs else []) + (['release'] if release_jobs else [])
    + (['deploy'] if deploy_jobs else [])
    + (['operate'] if operate_jobs else []) }}
  when: false
