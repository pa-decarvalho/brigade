---
lint_yamllint_version:
  type: str
  help: yamllint version (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'yamllint' in lint }}"

lint_yamllint_command:
  type: str
  help: Command of lint:yamllint (empty for brigade's)
  default: ""
  when: "{{ customize_tools and 'yamllint' in lint }}"
