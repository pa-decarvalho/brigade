---
ci:
  type: str
  help: CI platform
  choices:
    - github
    - gitlab
    - gitea
    - none
  default: github

tools:
  type: str
  help: Tools
  multiselect: true
  choices:
    yamllint (lint): yamllint
    gitleaks (lint): gitleaks
    typos (lint): typos
    editorconfig-checker (lint): editorconfig-checker
    taplo (lint): taplo
    renovate (lint): renovate
    ruff (lint): ruff
    clippy (lint): clippy
    rustfmt (lint): rustfmt
    uv (build): uv
    zensical (build, serve): zensical
    cargo (build, test): cargo
    pytest (test): pytest
    ctt (test): ctt
    pypi (release): pypi
    crates (release): crates
    pages (deploy):
      value: pages
      validator: >-
        {% if ci not in ['github', 'gitlab'] %}needs GitHub
        or GitLab{% endif %}
    ci-local (run the CI locally):
      value: ci-local
      validator: "{% if ci == 'none' %}needs a CI platform{% endif %}"
  default: [yamllint, gitleaks, typos]
  # Checked once tools are picked: a choice's own validator runs before that.
  validator: >-
    {% if 'pages' in tools and 'zensical' not in tools %}pages needs
    zensical{% endif %}

# Computed: a stage exists when a selected tool has a task in it.
build:
  type: bool
  default: >-
    {{ tools | select('in', ['uv', 'zensical', 'cargo'])
    | list | length > 0 }}
  when: false

test:
  type: bool
  default: >-
    {{ tools | select('in', ['pytest', 'ctt', 'cargo']) | list | length > 0 }}
  when: false

release:
  type: bool
  default: "{{ tools | select('in', ['pypi', 'crates']) | list | length > 0 }}"
  when: false

deploy:
  type: bool
  default: "{{ tools | select('in', ['pages']) | list | length > 0 }}"
  when: false

# Computed: the rust toolchain is installed when a tool needs it.
needs_rust:
  type: bool
  default: >-
    {{ tools | select('in', ['clippy', 'rustfmt', 'cargo', 'crates'])
    | list | length > 0 }}
  when: false

# Computed: the lint stage exists when a lint tool is selected
# or a CI platform adds its linter.
lint_stage:
  type: bool
  default: >-
    {{ ci != 'none' or tools | select('in', ['yamllint', 'gitleaks', 'typos',
    'editorconfig-checker', 'taplo', 'renovate', 'ruff', 'clippy', 'rustfmt'])
    | list | length > 0 }}
  when: false

# Asks a version and a command per selected tool (questions/tools/).
# An empty answer takes brigade's default, which is in the tool's Jinja file.
customize_tools:
  type: bool
  help: Customize tool versions and commands?
  default: false

# Optional mirrors (e.g. Nexus). Empty: download from the internet.
github_mirror:
  type: str
  help: Mirror of https://github.com/ for tool downloads (empty for none)
  default: ""

pypi_index:
  type: str
  help: PyPI simple index URL for uv and Python tools (empty for none)
  default: ""

rustup_mirror:
  type: str
  help: Rustup mirror URL, as RUSTUP_DIST_SERVER (empty for none)
  default: ""
  when: "{{ needs_rust }}"
