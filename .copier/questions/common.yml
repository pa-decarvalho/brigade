---
ci:
  type: str
  help: CI platform
  choices:
    - github
    - gitlab
    - gitea
    - none
  default: github

# Presets only pre-select tools below: the tools answer is the one used.
# Each value is the preset's tools.
presets:
  type: yaml
  help: Presets (pre-select their tools in the next question)
  multiselect: true
  choices:
    python (ruff, ty, pytest, uv): [ruff, ty, pytest, uv]
    go (golangci-lint): [golangci-lint]
    terraform (tflint, checkov, opentofu): [tflint, checkov, opentofu]
    ansible (ansible-lint, molecule, ansible): [ansible-lint, molecule, ansible]
    shell (shellcheck, shfmt): [shellcheck, shfmt]
    docker (hadolint): [hadolint]
    lua (stylua): [stylua]
    docs (rumdl, zensical, pages): [rumdl, zensical, pages]
    copier-template (ctt): [ctt]
    security (osv-scanner, checkov, zizmor): [osv-scanner, checkov, zizmor]
    ci (act or gitlab-ci-local, replays the CI): [act, gitlab-ci-local]
    maintenance (renovate, releasaurus): [renovate, releasaurus]
  default: []

tools:
  type: str
  help: Tools
  multiselect: true
  choices:
    brigade (lint): brigade
    yamllint (lint): yamllint
    gitleaks (lint): gitleaks
    typos (lint): typos
    editorconfig-checker (lint): editorconfig-checker
    taplo (lint): taplo
    renovate (lint, operate): renovate
    ruff (lint): ruff
    ty (lint): ty
    hadolint (lint): hadolint
    shellcheck (lint): shellcheck
    shfmt (lint): shfmt
    rumdl (lint): rumdl
    markdownlint (lint): markdownlint
    vale (lint): vale
    lychee (lint): lychee
    codespell (lint): codespell
    cspell (lint): cspell
    ls-lint (lint): ls-lint
    sqlfluff (lint): sqlfluff
    prettier (lint): prettier
    biome (lint): biome
    clang-format (lint): clang-format
    trivy (lint): trivy
    osv-scanner (lint): osv-scanner
    golangci-lint (lint): golangci-lint
    revive (lint): revive
    tflint (lint): tflint
    opentofu (lint): opentofu
    checkov (lint): checkov
    cfn-lint (lint): cfn-lint
    dotenv-linter (lint): dotenv-linter
    stylua (lint): stylua
    zizmor (lint):
      value: zizmor
      validator: "{% if ci != 'github' %}needs GitHub{% endif %}"
    ansible-lint (lint): ansible-lint
    uv (build): uv
    zensical (build, serve): zensical
    pytest (test): pytest
    molecule (test): molecule
    ctt (test): ctt
    releasaurus (release): releasaurus
    ansible (deploy, operate): ansible
    pages (deploy):
      value: pages
      validator: >-
        {% if ci not in ['github', 'gitlab'] %}needs GitHub
        or GitLab{% endif %}
    act (test):
      value: act
      validator: >-
        {% if ci not in ['github', 'gitea'] %}needs GitHub
        or Gitea{% endif %}
    gitlab-ci-local (test):
      value: gitlab-ci-local
      validator: "{% if ci != 'gitlab' %}needs GitLab{% endif %}"
  # brigade's defaults, then the presets' tools, without those the CI
  # platform refuses (see their validator).
  default: >-
    {%- set refused = {
      'github': ['gitlab-ci-local'],
      'gitlab': ['zizmor', 'act'],
      'gitea': ['zizmor', 'pages', 'gitlab-ci-local'],
      'none': ['zizmor', 'pages', 'act', 'gitlab-ci-local'],
    }[ci] -%}
    {{ (['brigade', 'yamllint', 'gitleaks', 'typos'] + presets | sum(start=[]))
    | reject('in', refused) | unique | list }}

# Stages: keep one or not, and its commands (empty: all its tools).
lint_enabled:
  type: bool
  help: Add the lint stage?
  default: true

lint_commands:
  type: yaml
  help: Commands of the lint stage, run in order (empty for all its tools)
  default: []
  when: "{{ lint_enabled }}"

build_enabled:
  type: bool
  help: Add the build stage?
  default: true

build_commands:
  type: yaml
  help: Commands of the build stage, run in order (empty for all its tools)
  default: []
  when: "{{ build_enabled }}"

test_enabled:
  type: bool
  help: Add the test stage?
  default: true

test_commands:
  type: yaml
  help: Commands of the test stage, run in order (empty for all its tools)
  default: []
  when: "{{ test_enabled }}"

release_enabled:
  type: bool
  help: Add the release stage?
  default: true

release_commands:
  type: yaml
  help: Commands of the release stage, run in order (empty for all its tools)
  default: []
  when: "{{ release_enabled }}"

deploy_enabled:
  type: bool
  help: Add the deploy stage?
  default: true

deploy_commands:
  type: yaml
  help: Commands of the deploy stage, run in order (empty for all its tools)
  default: []
  when: "{{ deploy_enabled }}"

operate_enabled:
  type: bool
  help: Add the operate stage?
  default: true

operate_commands:
  type: yaml
  help: Commands of the operate stage, run in order (empty for all its tools)
  default: []
  when: "{{ operate_enabled }}"

operate_schedule:
  type: str
  help: >-
    Cron schedule of the operate workflow, e.g. "0 5 * * 1" (empty for manual
    runs only)
  default: ""
  when: "{{ operate_enabled and ci in ['github', 'gitea'] }}"

# Asks a version and a command per selected tool (questions/tools/).
# An empty answer takes brigade's default, which is in the tool's Jinja file.
customize_tools:
  type: bool
  help: Customize tool versions and commands?
  default: false

# Optional mirrors (e.g. Nexus). Empty: download from the internet.
github_mirror:
  type: str
  help: Mirror of https://github.com/ for tool downloads (empty for none)
  default: ""

pypi_index:
  type: str
  help: PyPI simple index URL for uv and Python tools (empty for none)
  default: ""
