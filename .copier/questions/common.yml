---
ci:
  type: str
  help: CI platform
  choices:
    - github
    - gitlab
    - gitea
    - none
  default: github

# Presets only pre-select tools below: the tools answer is the one used.
presets:
  type: str
  help: Presets (pre-select their tools in the next question)
  multiselect: true
  choices:
    python (ruff, ty, pytest, uv): python
    go (golangci-lint): go
    terraform (tflint, checkov): terraform
    ansible (ansible-lint, molecule, ansible): ansible
    shell (shellcheck, shfmt): shell
    docker (hadolint): docker
    lua (stylua): lua
    docs (rumdl, zensical, pages): docs
    copier-template (ctt): copier-template
    security (osv-scanner, checkov, zizmor): security
    ci (act or gitlab-ci-local, replays the CI): ci
    maintenance (renovate, releasaurus): maintenance
  default: []

tools:
  type: str
  help: Tools
  multiselect: true
  choices:
    brigade (lint): brigade
    yamllint (lint): yamllint
    gitleaks (lint): gitleaks
    typos (lint): typos
    editorconfig-checker (lint): editorconfig-checker
    taplo (lint): taplo
    renovate (lint, operate): renovate
    ruff (lint): ruff
    ty (lint): ty
    hadolint (lint): hadolint
    shellcheck (lint): shellcheck
    shfmt (lint): shfmt
    rumdl (lint): rumdl
    osv-scanner (lint): osv-scanner
    golangci-lint (lint): golangci-lint
    tflint (lint): tflint
    checkov (lint): checkov
    dotenv-linter (lint): dotenv-linter
    stylua (lint): stylua
    zizmor (lint):
      value: zizmor
      validator: "{% if ci != 'github' %}needs GitHub{% endif %}"
    ansible-lint (lint): ansible-lint
    uv (build): uv
    zensical (build, serve): zensical
    pytest (test): pytest
    molecule (test): molecule
    ctt (test): ctt
    releasaurus (release): releasaurus
    ansible (deploy, operate): ansible
    pages (deploy):
      value: pages
      validator: >-
        {% if ci not in ['github', 'gitlab'] %}needs GitHub
        or GitLab{% endif %}
    act (test):
      value: act
      validator: >-
        {% if ci not in ['github', 'gitea'] %}needs GitHub
        or Gitea{% endif %}
    gitlab-ci-local (test):
      value: gitlab-ci-local
      validator: "{% if ci != 'gitlab' %}needs GitLab{% endif %}"
  # brigade's defaults, then each preset's tools, without those the CI
  # platform refuses.
  default: >-
    {%- set gh = ci == 'github' -%}
    {%- set pages = ['pages'] if ci in ['github', 'gitlab'] else [] -%}
    {%- set replay = {'github': ['act'], 'gitea': ['act'],
      'gitlab': ['gitlab-ci-local']} -%}
    {%- set by_preset = {
      'python': ['ruff', 'ty', 'pytest', 'uv'],
      'go': ['golangci-lint'],
      'terraform': ['tflint', 'checkov'],
      'ansible': ['ansible-lint', 'molecule', 'ansible'],
      'shell': ['shellcheck', 'shfmt'],
      'docker': ['hadolint'],
      'lua': ['stylua'],
      'docs': ['rumdl', 'zensical'] + pages,
      'copier-template': ['ctt'],
      'security': ['osv-scanner', 'checkov'] + (['zizmor'] if gh else []),
      'ci': replay.get(ci, []),
      'maintenance': ['renovate', 'releasaurus'],
    } -%}
    {%- set ns = namespace(
      tools=['brigade', 'yamllint', 'gitleaks', 'typos']) -%}
    {%- for preset in presets -%}
    {%- for tool in by_preset[preset] if tool not in ns.tools -%}
    {%- set ns.tools = ns.tools + [tool] -%}
    {%- endfor -%}
    {%- endfor -%}
    {{ ns.tools }}

# Stages: keep one or not, and its commands (empty: all its tools).
lint_enabled:
  type: bool
  help: Add the lint stage?
  default: true

lint_commands:
  type: yaml
  help: Commands of the lint stage, run in order (empty for all its tools)
  default: []
  when: "{{ lint_enabled }}"

build_enabled:
  type: bool
  help: Add the build stage?
  default: true

build_commands:
  type: yaml
  help: Commands of the build stage, run in order (empty for all its tools)
  default: []
  when: "{{ build_enabled }}"

test_enabled:
  type: bool
  help: Add the test stage?
  default: true

test_commands:
  type: yaml
  help: Commands of the test stage, run in order (empty for all its tools)
  default: []
  when: "{{ test_enabled }}"

release_enabled:
  type: bool
  help: Add the release stage?
  default: true

release_commands:
  type: yaml
  help: Commands of the release stage, run in order (empty for all its tools)
  default: []
  when: "{{ release_enabled }}"

deploy_enabled:
  type: bool
  help: Add the deploy stage?
  default: true

deploy_commands:
  type: yaml
  help: Commands of the deploy stage, run in order (empty for all its tools)
  default: []
  when: "{{ deploy_enabled }}"

operate_enabled:
  type: bool
  help: Add the operate stage?
  default: true

operate_commands:
  type: yaml
  help: Commands of the operate stage, run in order (empty for all its tools)
  default: []
  when: "{{ operate_enabled }}"

operate_schedule:
  type: str
  help: >-
    Cron schedule of the operate workflow, e.g. "0 5 * * 1" (empty for manual
    runs only)
  default: ""
  when: "{{ operate_enabled and ci in ['github', 'gitea'] }}"

# Asks a version and a command per selected tool (questions/tools/).
# An empty answer takes brigade's default, which is in the tool's Jinja file.
customize_tools:
  type: bool
  help: Customize tool versions and commands?
  default: false

# Optional mirrors (e.g. Nexus). Empty: download from the internet.
github_mirror:
  type: str
  help: Mirror of https://github.com/ for tool downloads (empty for none)
  default: ""

pypi_index:
  type: str
  help: PyPI simple index URL for uv and Python tools (empty for none)
  default: ""
