---
# One multi-select per stage; a stage without tools is left out.
lint:
  type: str
  help: Lint tools (the CI platform adds its own linter)
  multiselect: true
  choices:
    yamllint: yamllint
    gitleaks: gitleaks
    typos: typos
    editorconfig-checker: editorconfig-checker
    ruff: ruff
    clippy: clippy
    rustfmt: rustfmt
  default: [yamllint, gitleaks, typos]

build:
  type: str
  help: Build tools
  multiselect: true
  choices:
    uv: uv
    cargo: cargo
  default: []

test:
  type: str
  help: Test tools
  multiselect: true
  choices:
    pytest: pytest
    cargo: cargo
  default: []

release:
  type: str
  help: Release tools, run by the CI on X.Y.Z tags
  multiselect: true
  choices:
    pypi: pypi
    crates: crates
  default: []

ci:
  type: str
  help: CI platform
  choices:
    - github
    - gitlab
    - gitea
    - none
  default: github

# Computed: the rust toolchain is installed when a tool needs it.
needs_rust:
  type: bool
  default: >-
    {{ 'clippy' in lint or 'rustfmt' in lint or 'cargo' in test
    or 'cargo' in build or 'crates' in release }}
  when: false

# Computed: the lint stage exists when a lint tool is selected
# or a CI platform adds its linter.
lint_stage:
  type: bool
  default: "{{ lint | length > 0 or ci != 'none' }}"
  when: false

# Asks a version and a command per selected tool (questions/<stage>/).
# An empty answer takes brigade's default, which is in the tool's Jinja file.
customize_tools:
  type: bool
  help: Customize tool versions and commands?
  default: false

# Optional mirrors (e.g. Nexus). Empty: download from the internet.
github_mirror:
  type: str
  help: Mirror of https://github.com/ for tool downloads (empty for none)
  default: ""

pypi_index:
  type: str
  help: PyPI simple index URL for uv and Python tools (empty for none)
  default: ""

rustup_mirror:
  type: str
  help: Rustup mirror URL, as RUSTUP_DIST_SERVER (empty for none)
  default: ""
  when: "{{ needs_rust }}"
