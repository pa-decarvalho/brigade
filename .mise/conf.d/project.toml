# brigade's own tasks: not generated by the template, so brigade:update keeps them.

[env]
# Generated projects in .ctt/ run their own mise tasks, isolated from this config.
MISE_TRUSTED_CONFIG_PATHS = "{{ config_root }}/.ctt"
MISE_CEILING_PATHS = "{{ config_root }}/.ctt"

[tasks."update:test"]
description = "Update a project from the latest release to HEAD and run its stages"
# After ctt:test when both run, so they do not install the same tools at the same time.
wait_for = ["ctt:test"]
run = "uv run --no-project python .mise/scripts/test_update.py"

[tasks."ci:test"]
description = "Run the generated CI of every variant locally with act / gitlab-ci-local (Docker)"
depends = ["ctt:test"]
run = "uv run --no-project python .mise/scripts/test_ci.py"
