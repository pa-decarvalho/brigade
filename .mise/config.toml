min_version = "2026.11.0"

[tools]
uv = "0.13.7"
# Creates the rust test projects (cargo init).
rust = "1.99.1"
"pipx:yamllint" = "1.38.0"
actionlint = "1.7.12"
taplo = "0.10.0"
editorconfig-checker = "4.0.2"
gitleaks = "8.30.1"
typos = "1.52.0"
"pipx:check-jsonschema" = { version = "0.39.0", uvx_args = "--with json5" }
"pipx:zensical" = "0.1.0"

[env]
# Generated projects in .ctt/ run their own mise tasks, isolated from this config.
MISE_TRUSTED_CONFIG_PATHS = "{{ config_root }}/.ctt"
MISE_CEILING_PATHS = "{{ config_root }}/.ctt/src/.ctt"

# Stages, same convention as the template: each runs every "<stage>:<tool>" task.
# Tool config is given inline: no config files.

[tasks.lint]
description = "Stage: static checks"
depends = ["lint:*"]

[tasks.test]
description = "Stage: tests"
depends = ["test:*"]

[tasks."lint:yamllint"]
description = "Check YAML files with yamllint"
run = 'yamllint --strict -d "{extends: default, ignore: [.ctt/, template/], rules: {truthy: {check-keys: false}}}" .'

[tasks."lint:actionlint"]
description = "Check GitHub workflows with actionlint"
run = "actionlint"

[tasks."lint:taplo"]
description = "Check TOML formatting with taplo"
run = 'taplo fmt --check --no-auto-config -o indent_string="    " -o array_auto_expand=false -o array_auto_collapse=false ".mise/**/*.toml" ctt.toml zensical.toml "template/**/*.toml"'

[tasks."lint:gitleaks"]
description = "Check git history and staged changes for secrets with gitleaks"
run = [
    "gitleaks git --redact --no-banner",
    "gitleaks git --pre-commit --staged --redact --no-banner",
]

[tasks."lint:typos"]
description = "Check spelling with typos"
run = "typos --hidden --exclude .git"

[tasks."lint:renovate"]
description = "Check the Renovate config"
run = "check-jsonschema --builtin-schema vendor.renovate .github/renovate.json5"

[tasks."lint:editorconfig"]
description = "Check files against .editorconfig"
run = 'editorconfig-checker -exclude "^\.ctt/"'

[tasks.pre-commit]
description = "Checks run by the git pre-commit hook"
depends = ["lint"]

[tasks.hooks]
description = "Install a git pre-commit hook that runs mise run pre-commit"
run = "mise generate git-pre-commit --task pre-commit --write"

[tasks."test:ctt"]
description = "Render every ctt.toml variant into .ctt/ and run its stages"
run = [
    # Snapshot tracked files into .ctt/src, then render from there (see the script).
    "uv run --no-project python .mise/scripts/snapshot.py",
    "uvx --from copier-template-tester==3.0.0 --with copier==9.19.1 ctt --base-dir .ctt/src",
]

[tasks."test:update"]
description = "Update a project from the latest release to HEAD and run its stages"
# After test:ctt when both run, so they do not install the same tools at the same time.
wait_for = ["test:ctt"]
run = "uv run --no-project python .mise/scripts/test_update.py"

[tasks."test:ci"]
description = "Run the generated CI of every variant locally with act / gitlab-ci-local (Docker)"
depends = ["test:ctt"]
run = "uv run --no-project python .mise/scripts/test_ci.py"

[tasks."test:docs"]
description = "Build the documentation site in strict mode (fails on broken links)"
run = "zensical build --strict --clean"

[tasks."docs:serve"]
description = "Preview the documentation site"
run = "zensical serve --open"
