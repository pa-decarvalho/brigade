min_version = "2026.11.0"

[tools]
# Needed by pipx tools (yamllint...) when installing from the lockfile.
python = "3.14.10"
uv = "0.13.7"
"pipx:yamllint" = "1.38.0"
actionlint = "1.7.12"
taplo = "0.10.0"
editorconfig-checker = "4.0.2"
gitleaks = "8.30.1"
typos = "1.52.0"
act = "0.2.97"
node = "24.22.2"
"npm:gitlab-ci-local" = "4.77.1"

# Lock tool versions and checksums in .mise/mise.lock (commit it, with .mise/locks/).
# CI installs from it (jdx/mise-action adds --locked when the file exists).
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64", "windows-x64"]

[env]
# Generated projects in .ctt/ run their own mise tasks, isolated from this config.
MISE_TRUSTED_CONFIG_PATHS = "{{ config_root }}/.ctt"
MISE_CEILING_PATHS = "{{ config_root }}/.ctt/src/.ctt"

# Stages, same convention as the template: each runs every "<stage>:<tool>" task.
# Tool config is given inline: no config files.

[tasks.lint]
description = "Stage: static checks"
depends = ["lint:*"]

[tasks.test]
description = "Stage: tests"
depends = ["test:*"]

[tasks."lint:yamllint"]
description = "Check YAML files with yamllint"
run = 'yamllint --strict -d "{extends: default, ignore: [.ctt/, template/, .mise/locks/], rules: {truthy: {check-keys: false}}}" .'

[tasks."lint:actionlint"]
description = "Check GitHub workflows with actionlint"
run = "actionlint"

[tasks."lint:taplo"]
description = "Check TOML formatting with taplo"
run = 'taplo fmt --check --no-auto-config -o indent_string="    " -o array_auto_expand=false -o array_auto_collapse=false ".mise/**/*.toml" ctt.toml "template/**/*.toml"'

[tasks."lint:gitleaks"]
description = "Check git history and staged changes for secrets with gitleaks"
run = [
    "gitleaks git --redact --no-banner",
    "gitleaks git --pre-commit --staged --redact --no-banner",
]

[tasks."lint:typos"]
description = "Check spelling with typos"
run = "typos --hidden --exclude .git"

[tasks."lint:renovate"]
description = "Check the Renovate config"
# uvx, not a mise tool: json5 support needs --with, which locked pipx tools do not allow.
run = "uvx --from check-jsonschema==0.39.0 --with json5 check-jsonschema --builtin-schema vendor.renovate .github/renovate.json5"

[tasks."lint:editorconfig"]
description = "Check files against .editorconfig"
run = 'editorconfig-checker -exclude "^(\.ctt|\.mise/locks)/"'

[tasks.pre-commit]
description = "Checks run by the git pre-commit hook"
depends = ["lint"]

[tasks.hooks]
description = "Install a git pre-commit hook that runs mise run pre-commit"
run = "mise generate git-pre-commit --task pre-commit --write"

[tasks."test:ctt"]
description = "Render every ctt.toml variant into .ctt/ and run its stages"
run = [
    # Snapshot tracked files into .ctt/src, then render from there (see the script).
    "python .mise/scripts/snapshot.py",
    "uvx --from copier-template-tester==3.0.0 --with copier==9.19.1 ctt --base-dir .ctt/src",
]

[tasks."test:update"]
description = "Update a project from the latest release to HEAD and run its stages"
# After test:ctt: both install the same tools, which can deadlock on Windows when run in parallel.
depends = ["test:ctt"]
run = "python .mise/scripts/test_update.py"

# Run the generated CI files locally in Docker. ctt removes .git, simulators need one.

[tasks."ci:github"]
description = "Run the generated GitHub workflow with act (Docker)"
depends = ["test:ctt"]
dir = "{{ config_root }}/.ctt/src/.ctt/python-github"
run = [
    "git init -q",
    "git add -A",
    "git -c user.name=ctt -c user.email=ctt@localhost commit -qm init",
    "act pull_request -P ubuntu-latest=catthehacker/ubuntu:act-24.04",
]

[tasks."ci:gitlab"]
description = "Run the generated GitLab pipeline with gitlab-ci-local (Docker)"
depends = ["test:ctt"]
dir = "{{ config_root }}/.ctt/src/.ctt/python-gitlab"
run = [
    "git init -q",
    "git add -A",
    "git -c user.name=ctt -c user.email=ctt@localhost commit -qm init",
    "gitlab-ci-local",
]
