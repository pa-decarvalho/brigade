---
# What every forge shares, included by <forge>/compose.yml: the network, the
# registry publish pushes to and the cluster deploy installs on. Jobs reach
# them by service name on the brigade-forges network. Throwaway setup, for
# local tests only.
networks:
  default:
    name: brigade-forges

services:
  # Nexus, as companies run it: Python (uv:deploy), npm (node:deploy) and image
  # (docker:deploy) repositories, each deploy logged in as a deploy user,
  # anonymous reads (tests/e2e/up.py sets it up). Images are pushed by the
  # host's Docker daemon (the runners mount its socket), which reaches the
  # docker repository as localhost:5099 only (plain HTTP is allowed on
  # localhost).
  nexus:
    image: sonatype/nexus3:3.98.3
    environment:
      INSTALL4J_ADD_VM_PARAMS: -Xms768m -Xmx768m -XX:MaxDirectMemorySize=512m
    ports: ["127.0.0.1:8099:8081", "127.0.0.1:5099:5000"]
    healthcheck:
      test:
        - CMD
        - curl
        - -fs
        - http://localhost:8081/service/rest/v1/status/writable
      interval: 3s
      retries: 100

  # A Kubernetes cluster (k3s) for helm:deploy, started by the tests that need
  # one (profile cluster, tests/e2e/up.py reset_cluster). Jobs reach its API as
  # https://k3s:6443 (in its certificate); its images come from the internet.
  k3s:
    image: rancher/k3s:v1.37.2-k3s1
    profiles: [cluster]
    command:
      - server
      - --tls-san=k3s
      - --disable=traefik
      - --disable=metrics-server
      - --disable=servicelb
    privileged: true
    tmpfs: [/run, /var/run]
    healthcheck:
      test: [CMD, kubectl, get, --raw, /readyz]
      interval: 3s
      retries: 100
