---
# Gitea and its act_runner (also the github forge: a ci: github project on
# Gitea, whose runner runs GitHub Actions workflows). BRIGADE_SRC (brigade's
# checkout) and BRIGADE_TEMPLATES (its tags' clones), set by tests/e2e/up.py,
# are mounted read-only at the same paths in the jobs: the projects' _src_path.
name: brigade-forges
include: [../compose.yml]

volumes:
  gitea:
  gitea-runner:

configs:
  runner:
    content: |
      runner:
        file: /data/.runner
        capacity: 2
        timeout: 1h
        labels:
          - ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-latest
      container:
        network: brigade-forges
        options: >-
          -v ${BRIGADE_SRC:?}:${BRIGADE_SRC}:ro
          -v ${BRIGADE_TEMPLATES:?}:${BRIGADE_TEMPLATES}:ro
        valid_volumes: ["${BRIGADE_SRC}", "${BRIGADE_TEMPLATES}"]

services:
  gitea:
    image: gitea/gitea:28.4.0
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__DOMAIN: gitea
      GITEA__actions__DEFAULT_ACTIONS_URL: github
      GITEA__repository__DEFAULT_BRANCH: main
      GITEA_RUNNER_REGISTRATION_TOKEN: brigadelocalforgesrunnertoken0000000001
    ports: ["127.0.0.1:3001:3000"]
    volumes: [gitea:/data]
    healthcheck:
      test: [CMD, curl, -fs, http://localhost:3000/api/healthz]
      interval: 3s
      retries: 40

  gitea-runner:
    image: gitea/act_runner:0.6.1
    depends_on: {gitea: {condition: service_healthy}}
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: brigadelocalforgesrunnertoken0000000001
      GITEA_RUNNER_NAME: local
      CONFIG_FILE: /config.yaml
    configs: [{source: runner, target: /config.yaml}]
    volumes:
      - gitea-runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
