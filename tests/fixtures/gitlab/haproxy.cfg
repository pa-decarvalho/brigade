# GitLab's name on the network (compose.yml): port 80 passes through, port 443
# adds the TLS Releasaurus requires.
global
  log stdout format raw local0

resolvers docker
  nameserver dns 127.0.0.11:53

defaults
  mode http
  timeout connect 5s
  timeout client 10m
  timeout server 10m

frontend proxy
  bind :80
  bind :443 ssl crt /certs/gitlab.pem
  default_backend gitlab

backend gitlab
  # Resolved at run time: GitLab may start after the proxy.
  server gitlab gitlab-app:80 resolvers docker init-addr none
