---
# Forgejo and its runner. BRIGADE_SRC (brigade's checkout) and
# BRIGADE_TEMPLATES (its tags' clones), set by tests/e2e/up.py, are mounted
# read-only at the same paths in the jobs: the projects' _src_path.
name: brigade-forges
include: [../compose.yml]

volumes:
  forgejo:
  forgejo-runner:

configs:
  runner:
    content: |
      runner:
        file: /data/.runner
        capacity: 2
        timeout: 1h
        labels:
          - ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-latest
      container:
        network: brigade-forges
        docker_host: automount
        options: >-
          -v ${BRIGADE_SRC:?}:${BRIGADE_SRC}:ro
          -v ${BRIGADE_TEMPLATES:?}:${BRIGADE_TEMPLATES}:ro
        valid_volumes: ["${BRIGADE_SRC}", "${BRIGADE_TEMPLATES}"]

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1
    environment:
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__ROOT_URL: http://forgejo:3000/
      FORGEJO__server__DOMAIN: forgejo
      FORGEJO__repository__DEFAULT_BRANCH: main
    ports: ["127.0.0.1:3002:3000"]
    volumes: [forgejo:/data]
    healthcheck:
      test: [CMD, curl, -fs, http://localhost:3000/api/healthz]
      interval: 3s
      retries: 40

  # Started by up.py once the forge knows the runner's secret (forgejo-cli
  # actions register).
  forgejo-runner:
    image: code.forgejo.org/forgejo/runner:13.2.1
    profiles: [runner]
    user: root
    configs: [{source: runner, target: /config.yaml}]
    volumes:
      - forgejo-runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /data
    command:
      - sh
      - -c
      - >-
        forgejo-runner create-runner-file --instance http://forgejo:3000
        --secret 0123456789abcdef0123456789abcdef01234567 --name local &&
        forgejo-runner daemon --config /config.yaml
