---
# Local forges with their runners, to test brigade end to end: run.py starts
# one forge's profile (github runs a ci: github project on Gitea), seeds it,
# then runs the tests in the workstation. Everything shares the brigade-forges
# network: the forges' URLs are their service names, the same for the runners'
# job containers and the workstation. Throwaway credentials, for these local
# containers only.
name: brigade-forges

networks:
  default:
    name: brigade-forges

volumes:
  mise:
  gitea:
  gitea-runner:
  forgejo:
  forgejo-runner:
  gitlab-config:
  gitlab-data:
  gitlab-certs:
  gitlab-runner:

services:
  # The developer's machine: creates the project, applies brigade, pushes, and
  # runs the tests (pytest).
  workstation:
    image: jdxcode/mise:2026.11.10-debian
    profiles: [gitea, github, forgejo, gitlab]
    volumes:
      - ../..:/brigade:ro
      - ../../.forges:/notes
      - mise:/mise
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      MISE_YES: "1"
      MISE_TRUSTED_CONFIG_PATHS: /work
      GIT_AUTHOR_NAME: brigade
      GIT_AUTHOR_EMAIL: brigade@localhost
      GIT_COMMITTER_NAME: brigade
      GIT_COMMITTER_EMAIL: brigade@localhost
    working_dir: /work
    entrypoint: []

  # The package index deploys publish to, the same for every forge (no auth).
  pypi:
    image: pypiserver/pypiserver:v2.4.3
    profiles: [gitea, github, forgejo, gitlab]
    command: [run, -a, ., -P, ., /data/packages]
    ports: ["127.0.0.1:8099:8080"]

  gitea:
    image: gitea/gitea:28.4.0
    profiles: [gitea, github]
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__DOMAIN: gitea
      GITEA__actions__DEFAULT_ACTIONS_URL: github
      GITEA__repository__DEFAULT_BRANCH: main
      GITEA_RUNNER_REGISTRATION_TOKEN: brigadelocalforgesrunnertoken0000000001
    ports: ["127.0.0.1:3001:3000"]
    volumes: [gitea:/data]
    healthcheck:
      test: [CMD, curl, -fs, http://localhost:3000/api/healthz]
      interval: 3s
      retries: 40

  gitea-runner:
    image: gitea/act_runner:0.6.1
    profiles: [gitea, github]
    depends_on: {gitea: {condition: service_healthy}}
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: brigadelocalforgesrunnertoken0000000001
      GITEA_RUNNER_NAME: local
      CONFIG_FILE: /config.yaml
    volumes:
      - ./act-runner.yaml:/config.yaml:ro
      - gitea-runner:/data
      - /var/run/docker.sock:/var/run/docker.sock

  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1
    profiles: [forgejo]
    environment:
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__ROOT_URL: http://forgejo:3000/
      FORGEJO__server__DOMAIN: forgejo
      FORGEJO__repository__DEFAULT_BRANCH: main
    ports: ["127.0.0.1:3002:3000"]
    volumes: [forgejo:/data]
    healthcheck:
      test: [CMD, curl, -fs, http://localhost:3000/api/healthz]
      interval: 3s
      retries: 40

  # Started by run.py once the forge knows its secret (forgejo-cli actions
  # register).
  forgejo-runner:
    image: code.forgejo.org/forgejo/runner:13.2.1
    profiles: [forgejo]
    user: root
    volumes:
      - ./act-runner.yaml:/config.yaml:ro
      - forgejo-runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /data
    command:
      - sh
      - -c
      - >-
        forgejo-runner create-runner-file --instance http://forgejo:3000
        --secret 0123456789abcdef0123456789abcdef01234567 --name local &&
        forgejo-runner daemon --config /config.yaml

  # Releasaurus calls GitLab's API on https://<host> only (GitlabBuilder
  # without insecure()): gitlab is a proxy in front of gitlab-app, plain on
  # port 80, TLS on 443 with a local CA that the jobs trust (SSL_CERT_FILE,
  # set by run.py's runner registration). ponytail: drop the proxy and the
  # certs once Releasaurus takes an http:// URL (robgonnella/releasaurus#421).
  gitlab-certs:
    image: alpine:3.22
    profiles: [gitlab]
    volumes: [gitlab-certs:/certs]
    working_dir: /certs
    command:
      - sh
      - -c
      - >-
        [ -f bundle.pem ] && exit 0;
        apk add -q openssl ca-certificates &&
        openssl req -x509 -newkey rsa:2048 -nodes -days 365
        -subj /CN=brigade-forges -keyout ca.key -out ca.crt &&
        openssl req -newkey rsa:2048 -nodes -subj /CN=gitlab
        -addext subjectAltName=DNS:gitlab -keyout gitlab.key -out gitlab.csr &&
        openssl x509 -req -in gitlab.csr -CA ca.crt -CAkey ca.key
        -CAcreateserial -days 365 -copy_extensions copy -out gitlab.crt &&
        cat gitlab.crt gitlab.key > gitlab.pem &&
        cat /etc/ssl/certs/ca-certificates.crt ca.crt > bundle.pem

  gitlab:
    image: haproxy:3.2.27-alpine
    profiles: [gitlab]
    depends_on:
      gitlab-certs: {condition: service_completed_successfully}
      gitlab-app: {condition: service_healthy}
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - gitlab-certs:/certs:ro

  gitlab-app:
    image: gitlab/gitlab-ce:19.5.5-ce.0
    profiles: [gitlab]
    hostname: gitlab
    shm_size: 256m
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab'
        gitlab_rails['initial_root_password'] = 'brigade-local-forges-1'
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 10
        prometheus_monitoring['enable'] = false
        registry['enable'] = false
        gitlab_kas['enable'] = false
    ports: ["127.0.0.1:8929:80"]
    volumes: [gitlab-config:/etc/gitlab, gitlab-data:/var/opt/gitlab]
    healthcheck:
      test: [CMD, curl, -fs, http://localhost/-/readiness]
      interval: 10s
      retries: 60
      start_period: 120s

  # Registered by run.py with the runner token from the seed.
  gitlab-runner:
    image: gitlab/gitlab-runner:alpine-v19.5.3
    profiles: [gitlab]
    volumes:
      - gitlab-runner:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
