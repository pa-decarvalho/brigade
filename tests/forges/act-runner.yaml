---
# Gitea's act_runner and Forgejo's runner: jobs join the forges' network, so
# they reach the forge by its service name.
runner:
  file: /data/.runner
  capacity: 2
  timeout: 1h
  labels:
    - ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-latest
container:
  network: brigade-forges
