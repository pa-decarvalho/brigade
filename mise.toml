# brigade's own settings: not generated by the template, so brigade:update keeps them.
# mise reads this file through .miserc.toml.

[env]
# Generated projects in .ctt/ run their own mise tasks, isolated from this config.
MISE_TRUSTED_CONFIG_PATHS = "{{ config_root }}/.ctt"
MISE_CEILING_PATHS = "{{ config_root }}/.ctt"

# End-to-end tests on local forges (tests/e2e/phases.py, tests/fixtures/, Docker), as Molecule's
# converge, destroy and test: see docs/contributing.md. Not stage names (*:lint, *:build...),
# which brigade's stages would run in CI; its test stage is a list of ctt jobs.

[tasks."e2e:converge"]
description = "End-to-end: start the forge, then prepare, converge and verify each type; resumes where it stopped"
usage = '''
arg "<forge>" help="gitea, github (on Gitea), forgejo or gitlab"
arg "[type]..." var=#true help="Types (default: all): python, python-direct, node, bun, docker, java-maven, java-gradle, helm, ansible, app"
'''
run = "uv run --no-project python tests/e2e/phases.py converge {{ usage.forge }}{% for t in usage.type %} {{ t }}{% endfor %}"

[tasks."e2e:destroy"]
description = "End-to-end: forget the given types (start them over), or remove the forge and its data"
usage = '''
arg "<forge>" help="gitea, github (on Gitea), forgejo or gitlab"
arg "[type]..." var=#true help="Types to start over (default: none, the forge and its data removed)"
'''
run = "uv run --no-project python tests/e2e/phases.py destroy {{ usage.forge }}{% for t in usage.type %} {{ t }}{% endfor %}"

[tasks."e2e:test"]
description = "End-to-end tests: converge from scratch, then destroy; all: every forge, then the big Docker cleanup"
usage = '''
arg "<forge>" help="gitea, github (on Gitea), forgejo, gitlab, or all"
arg "[type]..." var=#true help="Types (default: all): python, python-direct, node, bun, docker, java-maven, java-gradle, helm, ansible, app"
'''
run = "uv run --no-project python tests/e2e/phases.py test {{ usage.forge }}{% for t in usage.type %} {{ t }}{% endfor %}"
