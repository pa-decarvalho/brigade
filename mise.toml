# brigade's own settings: not generated by the template, so brigade:update keeps them.
# mise reads this file through .miserc.toml.

[env]
# Generated projects in .ctt/ run their own mise tasks, isolated from this config.
MISE_TRUSTED_CONFIG_PATHS = "{{ config_root }}/.ctt"
MISE_CEILING_PATHS = "{{ config_root }}/.ctt"

# End-to-end tests on local forges (tests/e2e/, tests/fixtures/, Docker): see docs/contributing.md.
# <forge>:up, :run, :down, and :test (up, run, down). Not stage names (*:lint, *:build...),
# which brigade's stages would run in CI; its test stage is a list of ctt jobs.

[tasks."gitea:up"]
description = "Start Gitea and its runner for the end-to-end tests"
run = "uv run --no-project python tests/e2e/up.py gitea up"

[tasks."gitea:run"]
description = "Run the end-to-end tests on Gitea"
usage = 'arg "[type]..." var=#true help="Tests to run (default: all): python, python-direct, node, docker, java"'
run = "uv run --no-project python tests/e2e/up.py gitea run{% for t in usage.type %} {{ t }}{% endfor %}"

[tasks."gitea:down"]
description = "Remove Gitea and its data, then everything Docker no longer uses"
run = "uv run --no-project python tests/e2e/up.py gitea down"

[tasks."gitea:test"]
description = "End-to-end tests on Gitea: up, run, then down"
usage = 'arg "[type]..." var=#true help="Tests to run (default: all): python, python-direct, node, docker, java"'
run = "uv run --no-project python tests/e2e/up.py gitea test{% for t in usage.type %} {{ t }}{% endfor %}"

