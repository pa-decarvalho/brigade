# brigade's own settings: not generated by the template, so brigade:update keeps them.
# mise reads this file through .miserc.toml.

[env]
# Generated projects in .ctt/ run their own mise tasks, isolated from this config.
MISE_TRUSTED_CONFIG_PATHS = "{{ config_root }}/.ctt"
MISE_CEILING_PATHS = "{{ config_root }}/.ctt"
