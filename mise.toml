# brigade's own settings: not generated by the template, so brigade:update keeps them.
# mise reads this file through .miserc.toml.

[env]
# Generated projects in .ctt/ run their own mise tasks, isolated from this config.
MISE_TRUSTED_CONFIG_PATHS = "{{ config_root }}/.ctt"
MISE_CEILING_PATHS = "{{ config_root }}/.ctt"

# End-to-end tests on local forges (tests/forges/, Docker): see docs/contributing.md.
[tasks."forges:test"]
description = "Run brigade end to end on local forges (gitea, github, forgejo, gitlab, all)"
run = "uv run --no-project python tests/forges/run.py"

[tasks."forges:down"]
description = "Stop the local forges and delete their data"
dir = "{{ config_root }}/tests/forges"
run = "docker compose --profile gitea --profile forgejo --profile gitlab down --volumes"
